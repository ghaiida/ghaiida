<title>مهمة عقل المبرمج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a bright "control room" — light circuit-grid ground, one centered column of mission screens, a sticky HUD on top. Single committed light look. */
:root{
  --ground:#F3F6FD; --grid:#E3EAF8; --panel:#FFFFFF; --line:#D5DEF0; --line-2:#B9C6E2;
  --ink:#0E1B3D; --ink-2:#4A5677; --ink-3:#7A86A6;
  --royal:#1F4FD8; --royal-d:#0E2E8F; --royal-t:#E7EDFF;
  --emerald:#0E9F7A; --emerald-d:#06704F; --emerald-t:#DDF6EE;
  --amber:#F2A12E; --amber-d:#B86E00; --amber-t:#FFF2DB;
  --rose:#E0475B; --rose-t:#FDE7EA;
  --term:#0F1E44; --term-ink:#E6ECFF; --term-dim:#8D9BC7;
  --f-display:"Cairo","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Cairo","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{direction:rtl}
body{background-color:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 1.3px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,128px 128px,128px 128px;background-attachment:fixed}
#app{max-width:960px;margin-inline:auto;padding-inline:16px;padding-block:0 80px;min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0 0 .5em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.num,.tab{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* 3D buttons */
.btn{--c:var(--panel);--cd:var(--line-2);--fg:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.2;
  border:0;border-radius:14px;padding:.75em 1.3em;background:var(--c);color:var(--fg);cursor:pointer;position:relative;
  box-shadow:0 5px 0 var(--cd),0 10px 20px rgba(14,27,61,.12);transform:translateY(0);transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 6px 0 var(--cd),0 14px 24px rgba(14,27,61,.16)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cd),0 4px 8px rgba(14,27,61,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.royal{--c:var(--royal);--cd:var(--royal-d);--fg:#fff}
.btn.emerald{--c:var(--emerald);--cd:var(--emerald-d);--fg:#fff}
.btn.amber{--c:var(--amber);--cd:var(--amber-d);--fg:var(--ink)}
.btn.ghost{--c:transparent;--cd:transparent;box-shadow:none;border:2px solid var(--line-2)}
.btn.sm{font-size:.88rem;padding:.5em .9em;border-radius:11px}
.btn.lg{font-size:1.2rem;padding:.9em 1.8em;border-radius:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.row.c{justify-content:center}
.spacer{flex:1}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;margin-bottom:8px;
  background:linear-gradient(var(--ground) 70%,rgba(243,246,253,0))}
.hud .back{flex:none;width:44px;height:44px;border-radius:13px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--line-2);cursor:pointer;font-size:1.2rem;font-weight:800}
.hud-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.86rem;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.chip .k{font-size:.95rem}
.lvl-chip{background:var(--royal);color:#fff;box-shadow:0 2px 0 var(--royal-d)}
@media(max-width:560px){.chip.opt{display:none}}

/* panels */
.panel{background:var(--panel);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(14,27,61,.06);margin-bottom:18px;position:relative}
.panel h3{font-size:1.25rem;margin-bottom:4px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.06em;color:var(--royal);text-transform:uppercase}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.tag{display:inline-block;font-weight:800;font-size:.78rem;border-radius:999px;padding:2px 10px;background:var(--royal-t);color:var(--royal-d)}
.tag.em{background:var(--emerald-t);color:var(--emerald-d)}
.tag.am{background:var(--amber-t);color:var(--amber-d)}

/* robot guide */
.guide{display:flex;gap:14px;align-items:flex-end;margin-block:6px 18px}
.guide .rb{flex:none}
.say{flex:1;min-width:0;background:var(--panel);border-radius:20px 20px 6px 20px;padding:14px 18px;box-shadow:0 1px 0 var(--line),0 8px 20px rgba(14,27,61,.07);font-size:1.05rem;position:relative}
.say b{color:var(--royal-d)}
.rb svg{display:block;filter:drop-shadow(0 10px 12px rgba(14,27,61,.18))}
.rb.idle svg{animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.rb.shake svg{animation:shake .4s}
.rb.jump svg{animation:jump .5s}
@keyframes jump{40%{transform:translateY(-16px) scale(1.04)}}
@keyframes shake{20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shakeit{animation:shake .4s}

/* feedback & hints */
.fb{margin-top:14px;padding:12px 16px;border-radius:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;animation:rise .3s var(--ease)}
.fb.ok{background:var(--emerald-t);color:var(--emerald-d)}
.fb.bad{background:var(--amber-t);color:#7A4A00}
.fb.info{background:var(--royal-t);color:var(--royal-d)}
.fb .i{font-size:1.2rem;line-height:1.4}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hintbox{margin-top:12px;border:2px dashed var(--amber);border-radius:14px;padding:10px 14px;background:var(--amber-t)}
.hintbox .hl{font-weight:800;color:var(--amber-d);font-size:.85rem}
.hintbtn{position:absolute;top:14px;inset-inline-end:14px}

/* reveal (discover → explain) */
.reveal{border-radius:var(--r);padding:22px;margin-bottom:18px;background:linear-gradient(135deg,var(--royal) 0%,#2D63F0 55%,var(--emerald) 140%);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(31,79,216,.25);animation:rise .45s var(--ease)}
.reveal::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:24px solid rgba(255,255,255,.08)}
.reveal .k{font-family:var(--f-display);font-weight:800;font-size:.85rem;opacity:.85}
.reveal h2{font-size:clamp(1.4rem,4vw,2rem);margin-block:2px 8px}
.reveal p{max-width:62ch;font-size:1.08rem}
.reveal .eq{display:inline-block;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-block:6px}
.life{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.life span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem}

/* memory card */
.memcard{perspective:900px;margin-bottom:18px}
.memcard-in{background:var(--panel);border-radius:22px;padding:22px 22px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;
  box-shadow:0 2px 0 var(--amber),0 18px 36px rgba(242,161,46,.18);border:2px solid var(--amber);transform-origin:center;animation:flip .7s var(--ease)}
@keyframes flip{from{transform:rotateX(-80deg);opacity:0}to{transform:none;opacity:1}}
.memcard .glyph{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(145deg,var(--amber-t),#FFE2AE);box-shadow:inset 0 -6px 0 rgba(184,110,0,.15)}
.memcard .lbl{font-family:var(--f-display);font-weight:800;color:var(--amber-d);font-size:.85rem}
.memcard h4{font-size:1.25rem}
.memcard q{display:block;font-size:1.15rem;font-weight:700;quotes:"«" "»";margin-top:2px}
@media(max-width:520px){.memcard-in{grid-template-columns:1fr;text-align:center}.memcard .glyph{margin-inline:auto}}

/* reward toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;display:flex;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(14,27,61,.35);animation:toast 2.6s var(--ease) forwards;max-width:calc(100% - 32px)}
.toast .xp{color:var(--amber);font-family:var(--f-display)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.burst i{position:absolute;width:9px;height:9px;border-radius:2px;top:45%;left:50%;animation:burst 1.1s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(400deg);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
<style>
/* ===== intro / boot ===== */
.intro{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:30px}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.logo .mark{font-family:var(--f-display);font-weight:900;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1.05;letter-spacing:-.01em;
  background:linear-gradient(180deg,var(--royal) 0%,var(--royal-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(14,46,143,.18))}
.logo .pre{font-family:var(--f-display);font-weight:800;color:var(--emerald);font-size:1.1rem;letter-spacing:.04em}
.terminal{width:min(560px,100%);background:var(--term);color:var(--term-ink);border-radius:18px;padding:16px 18px;text-align:start;font-size:1rem;line-height:1.9;
  box-shadow:0 24px 50px rgba(14,27,61,.28),inset 0 0 0 1px rgba(255,255,255,.06);min-height:150px}
.terminal .bar{display:flex;gap:6px;margin-bottom:8px}
.terminal .bar i{width:10px;height:10px;border-radius:50%;background:#3B4A78}
.terminal .bar i:first-child{background:var(--rose)}
.terminal .ln{display:block}
.terminal .err{color:#FF9AA8}
.terminal .ok{color:#7EE6C2}
.terminal .cur::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--amber)}
@keyframes blink{50%{opacity:0}}
.core{width:140px;height:140px;position:relative;margin-block:6px}
.core .ring{position:absolute;inset:0;border-radius:50%;border:6px solid var(--royal-t);border-top-color:var(--royal);animation:spin 2.4s linear infinite}
.core .ring.r2{inset:18px;border-color:var(--emerald-t);border-bottom-color:var(--emerald);animation-duration:3.4s;animation-direction:reverse}
.core .dot{position:absolute;inset:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--amber) 45%,var(--amber-d));box-shadow:0 0 30px rgba(242,161,46,.6)}
.core.off .ring{animation-play-state:paused;border-top-color:var(--line-2)}
.core.off .ring.r2{border-bottom-color:var(--line-2)}
.core.off .dot{background:radial-gradient(circle at 35% 30%,#fff,#C9D1E6 50%,#8E9AB9);box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== home ===== */
.home-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-block:8px 22px}
.home-head h1{font-size:clamp(1.6rem,5vw,2.3rem)}
.me{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line),0 8px 18px rgba(14,27,61,.05);display:flex;flex-direction:column;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:1.5rem;line-height:1.2}
.stat .l{color:var(--ink-2);font-size:.82rem;font-weight:700}
.xpbar{height:10px;border-radius:999px;background:var(--royal-t);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--emerald));border-radius:999px;transition:width .6s var(--ease)}
@media(max-width:640px){.me{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:22px;perspective:1200px;margin-bottom:22px}
@media(max-width:700px){.gates{grid-template-columns:1fr}}
.gate{position:relative;border:0;border-radius:28px;padding:26px 22px 22px;cursor:pointer;text-align:start;color:#fff;overflow:hidden;min-height:280px;
  display:flex;flex-direction:column;gap:6px;transform-style:preserve-3d;transition:transform .35s var(--ease),box-shadow .35s var(--ease);
  box-shadow:0 10px 0 var(--gd),0 26px 50px rgba(14,27,61,.22)}
.gate:hover{transform:rotateX(4deg) rotateY(var(--ry,-5deg)) translateY(-4px)}
.gate:active{transform:translateY(6px);box-shadow:0 4px 0 var(--gd),0 12px 24px rgba(14,27,61,.2)}
.gate.g1{background:linear-gradient(150deg,#2D63F0,var(--royal) 50%,var(--royal-d));--gd:#0A2170;--ry:5deg}
.gate.g2{background:linear-gradient(150deg,#19C394,var(--emerald) 50%,var(--emerald-d));--gd:#054C36}
.gate .portal{position:absolute;inset-inline-end:-50px;top:-50px;width:230px;height:230px;border-radius:50%;
  border:18px solid rgba(255,255,255,.12);box-shadow:inset 0 0 0 18px rgba(255,255,255,.06),0 0 0 18px rgba(255,255,255,.05);transform:translateZ(30px)}
.gate .gicon{font-size:3rem;line-height:1;transform:translateZ(40px);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.gate .gk{font-family:var(--f-display);font-weight:800;font-size:.85rem;opacity:.85;margin-top:auto}
.gate h2{font-size:clamp(1.5rem,4vw,1.9rem);font-weight:900;transform:translateZ(20px)}
.gate .gs{opacity:.92;font-size:.98rem}
.gate .gp{display:flex;align-items:center;gap:10px;margin-top:10px}
.gate .gp .bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.gate .gp .bar i{display:block;height:100%;background:var(--amber);border-radius:999px}
.gate .gp b{font-family:var(--f-display);font-size:.9rem}
.side-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.side-row{grid-template-columns:1fr}}
.tile{display:flex;gap:14px;align-items:center;text-align:start;background:var(--panel);border:0;border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 4px 0 var(--line-2),0 10px 22px rgba(14,27,61,.06);transition:transform .15s var(--ease)}
.tile:hover{transform:translateY(-2px)}
.tile .ti{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--amber-t)}
.tile b{font-family:var(--f-display);font-size:1.05rem;display:block}
.tile span{color:var(--ink-2);font-size:.9rem}
.tile.done .ti{background:var(--emerald-t)}

/* ===== maps ===== */
.path{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.path::before{content:"";position:absolute;inset-inline-start:31px;top:30px;bottom:30px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--line-2) 0 10px,transparent 10px 18px)}
.node{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:start;border:0;background:var(--panel);border-radius:20px;padding:12px 16px 12px 14px;cursor:pointer;
  box-shadow:0 4px 0 var(--line-2),0 10px 22px rgba(14,27,61,.06);transition:transform .15s var(--ease)}
.node:hover:not(:disabled){transform:translateX(-4px)}
.node:disabled{cursor:not-allowed;opacity:.62}
.node .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:1.9rem;background:var(--royal-t);position:relative;z-index:1;box-shadow:inset 0 -5px 0 rgba(14,46,143,.12)}
.node.done .ic{background:var(--emerald-t)}
.node.locked .ic{background:#EEF1F8;filter:grayscale(1)}
.node .nb b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.35}
.node .nb span{color:var(--ink-2);font-size:.92rem}
.node .st{font-size:1.25rem}
.stepno{font-family:var(--f-display);font-weight:800;font-size:.75rem;color:var(--royal);display:block}
@media(max-width:520px){.node{grid-template-columns:52px 1fr auto}.node .ic{width:52px;height:52px;font-size:1.5rem;border-radius:16px}.path::before{inset-inline-start:25px}}

/* ===== shared mechanics ===== */
.stage{border-radius:18px;background:linear-gradient(180deg,#F7FAFF,#EDF2FD);padding:16px;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.cards{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.card{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:14px;padding:10px 14px;background:var(--panel);cursor:pointer;text-align:start;
  box-shadow:0 4px 0 var(--line-2),0 8px 14px rgba(14,27,61,.06);transition:transform .15s var(--ease),background .2s}
.card:hover:not(:disabled){transform:translateY(-2px)}
.card.on{background:var(--amber-t);box-shadow:0 4px 0 var(--amber)}
.card.ok{background:var(--emerald-t);box-shadow:0 4px 0 var(--emerald)}
.card.bad{background:var(--rose-t);box-shadow:0 4px 0 var(--rose)}
.card.sel{background:var(--royal);color:#fff;box-shadow:0 4px 0 var(--royal-d)}
.card:disabled{cursor:default}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:n}
.slots li{display:flex;align-items:center;gap:10px}
.slots li::before{counter-increment:n;content:counter(n,arabic-indic);width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:.9rem}
.slots li.empty::before{background:var(--line)}
.slots li.empty{color:var(--ink-3);font-size:.92rem}
.slots .card{flex:1}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.lbl{font-family:var(--f-display);font-weight:800;font-size:.82rem;color:var(--ink-2);margin-bottom:8px;display:block}
.bigq{font-family:var(--f-display);font-weight:800;font-size:1.2rem;margin-bottom:10px}

/* juice scene */
.scene{display:flex;align-items:flex-end;justify-content:center;gap:22px;min-height:150px;flex-wrap:wrap;padding-top:10px}
.prop{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;text-align:center}
.prop .e{font-size:2.6rem;line-height:1.1;transition:transform .3s var(--ease),opacity .3s,filter .3s}
.prop .e.off{opacity:.25;filter:grayscale(1)}
.prop .e.pop{animation:jump .5s}
.prop small{font-weight:700;font-size:.8rem;color:var(--ink-2)}
.bubble2{position:absolute;top:10px;inset-inline-start:12px;background:var(--panel);border-radius:14px;padding:6px 12px;font-weight:800;box-shadow:0 6px 16px rgba(14,27,61,.12);animation:rise .3s var(--ease);max-width:70%}

/* code / terminal lines */
.code{background:var(--term);color:var(--term-ink);border-radius:16px;padding:12px 14px;font-size:1rem;line-height:1.95;overflow-x:auto}
.code .cl{display:flex;gap:10px;align-items:center;border-radius:8px;padding-inline:8px;transition:background .2s,opacity .2s;cursor:default}
.code .cl .n{color:var(--term-dim);font-family:var(--f-mono);font-size:.8rem;min-width:1.4em}
.code .cl.ind{padding-inline-start:calc(8px + 1.8em)}
.code .cl.ind2{padding-inline-start:calc(8px + 3.6em)}
.code .cl.on{background:rgba(242,161,46,.28)}
.code .cl.hit{background:rgba(14,159,122,.35)}
.code .cl.miss{background:rgba(224,71,91,.28)}

<script>
document.documentElement.setAttribute('dir', 'rtl');
document.documentElement.setAttribute('lang', 'ar');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- timers: cleared on every screen change ---------- */
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const wait = ms => new Promise(r => later(r, ms));

/* ---------- player state (local first, cloud when available) ---------- */
const KEY = 'aql-v1';
const blank = () => ({ name: '', intro: false, xp: 0, logic: 0, bugs: 0, sound: true, streak: { last: '', count: 0 }, daily: { date: '', done: false }, missions: {} });
let S = blank();
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) S = Object.assign(blank(), o); } catch (e) {}
const M = id => (S.missions[id] = S.missions[id] || { done: false, stars: 0, attempts: 0, fails: 0, hints: 0, firstTry: false, bestMs: 0 });
let syncTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(syncTimer); syncTimer = setTimeout(pushCloud, 1200);
}

/* cloud: each student writes progress/<their id>; owner + editors read all (teacher view) */
const CLOUD = { db: null, user: null, uid: null, ready: false, teacher: false };
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    CLOUD.db = db; CLOUD.user = user;
    if (user) {
      CLOUD.uid = await user.id();
      CLOUD.teacher = (await user.isOwner()) || (await user.canEdit());
    }
    if (db && CLOUD.uid) {
      const snap = await db.doc('progress/' + CLOUD.uid).get();
      if (snap.exists) mergeCloud(snap.data() || {});
      CLOUD.ready = true;
    }
    if (typeof onCloudReady === 'function') onCloudReady();
  } catch (e) { /* stay local */ }
}
function mergeCloud(d) {

function levelInfo(xp = S.xp) {
  let i = 0; while (i < LEVELS.length - 1 && xp >= LEVELS[i + 1][0]) i++;
  const cur = LEVELS[i][0], nxt = LEVELS[i + 1] ? LEVELS[i + 1][0] : cur;
  return { n: i + 1, title: LEVELS[i][1], pct: nxt > cur ? Math.round((xp - cur) / (nxt - cur) * 100) : 100, toNext: Math.max(0, nxt - xp), max: !LEVELS[i + 1] };
}

  const y = new Date(Date.now() - 864e5); const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');

let AC = null;
function tone(f, d = .12, type = 'sine', v = .07, at = 0) {

    const t0 = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}

  tap() { tone(520, .05, 'triangle', .04); },

const ROUTES = {};

/* ---------- mission engine ----------
   Every mission = Experience (mechanic) → Discover (reveal "what you just did is…") → Explain (memory card) → Practice (inside mechanic) → Master (rewards).
   Mechanics are registered by name; content (CONTENT below, in 12-content.js) only references them, so new lessons are data, not code. */
const MECH = {};
const CONCEPTS = {
  problem: 'فهم المشكلة', io: 'المدخلات والمخرجات', algo: 'الخوارزمية', code: 'كتابة البرنامج', test: 'الاختبار',
  debug: 'تصحيح الأخطاء', optimize: 'تحسين الحل', loop: 'التكرار Loop', if: 'الشرط If', ifelse: 'If / Else', elseif: 'Else If', var: 'المتغيرات', inout: 'الإدخال والإخراج'
};
const missionById = id => CONTENT.missions.find(m => m.id === id);
const gateMissions = g => CONTENT.missions.filter(m => m.gate === g);
function isUnlocked(m) {
  if (m.gate === 'final') return gateMissions('build').every(x => M(x.id).done) && gateMissions('think').every(x => M(x.id).done);
  const list = gateMissions(m.gate), i = list.indexOf(m);
  return i <= 0 || M(list[i - 1].id).done;
}

ROUTES.m = id => {
  const def = missionById(id); if (!def) return go('home');
  if (!isUnlocked(def)) return go(def.gate === 'think' ? 'think' : 'build');
  const back = def.gate === 'think' ? 'think' : def.gate === 'final' ? 'home' : 'build';
  const list = gateMissions(def.gate), idx = list.indexOf(def);
  app.innerHTML = hud(`${def.icon} ${def.title}`, back) + `
    ${guide(def.intro, def.mood || 'happy')}
    <section class="panel" id="stage-panel"><button class="btn sm amber hintbtn" id="hintbtn">💡 أعطني تلميحًا</button>
      <span class="eyebrow">${def.gate === 'final' ? 'المهمة الأخيرة' : def.gate === 'build' ? `المهمة ${ar(idx + 1)} من ${ar(list.length)}` : `العالم ${ar(idx + 1)} من ${ar(list.length)}`}</span>
      <h3 style="padding-inline-end:150px">${def.task}</h3>
      <div id="stage" style="margin-top:14px"></div><div id="hint"></div><div id="fb"></div></section>
    <div id="after"></div>`;
  const rec = M(id); rec.attempts++; save();
  const t0 = Date.now(); let hintLv = 0, fails = 0, revealed = false, completed = false;
  const hintBtn = $('#hintbtn');
  hintBtn.onclick = () => {
    if (hintLv >= def.hints.length) return;
    const labels = ['تلميح بسيط', 'توجيه أوضح', 'مثال مشابه'];
    hintLv++; rec.hints++; save(); sfx.tap();
    $('#hint').innerHTML = def.hints.slice(0, hintLv).map((h, i) => `<div class="hintbox"><div class="hl">💡 ${labels[i]}</div>${h}</div>`).join('');
    if (hintLv >= def.hints.length) { hintBtn.disabled = true; hintBtn.textContent = '💡 استخدمت كل التلميحات'; }
  };
  const ctx = {
    def, cfg: def.cfg || {}, host: $('#stage'), fbEl: $('#fb'),
    say: (h, m) => say(h, m),
    info(h) { fbox($('#fb'), h, 'info'); },
    clear() { $('#fb').innerHTML = ''; },
    ok(h) { sfx.ok(); fbox($('#fb'), h, 'ok'); },
    fail(h, opts = {}) {
      fails++; rec.fails++; save(); sfx.oops();
      const extra = fails >= 2 && hintLv < def.hints.length ? '<br><small>تحتاج دفعة صغيرة؟ اضغط 💡 أعطني تلميحًا.</small>' : '';
      fbox($('#fb'), `${h}${opts.noCheck ? '' : '<br><b>هل تريد فحص خطواتك؟</b> 🔍'}${extra}`, 'bad');
      if (fails >= 2) { shake(hintBtn); }
    },
    bug() { S.bugs++; save(); sfx.bug(); },
    reveal() {
      if (revealed) return; revealed = true;
      const r = def.reveal; if (!r) return;
      $('#after').insertAdjacentHTML('beforeend', `<section class="reveal"><div class="k">${r.k || 'اكتشفت للتو…'}</div><h2>${r.title}</h2>${r.text ? `<p>${r.text}</p>` : ''}${r.eq ? `<div class="eq">${r.eq}</div>` : ''}${r.life ? `<div class="life">${r.life.map(x => `<span>${x}</span>`).join('')}</div>` : ''}</section>`);

    },
    complete(bonus = {}) {

      const ms = Date.now() - t0, first = !rec.done;

      let xp = first ? def.xp || 40 : 10; let logic = 0;
      if (fails === 0) { logic = def.logic || 2; if (first) rec.firstTry = true; }
      if (first && hintLv === 0) xp += 10;
      rec.done = true; rec.stars = Math.max(rec.stars, stars); if (!rec.bestMs || ms < rec.bestMs) rec.bestMs = ms;
      const before = levelInfo().n; S.xp += xp; S.logic += logic; touchStreak(); save();
      const after = levelInfo();
      sfx.win(); burst();
      const mem = def.memory;
      const next = list[idx + 1];
      $('#after').insertAdjacentHTML('beforeend', `
        ${mem ? `<div class="memcard"><div class="memcard-in"><div class="glyph">${mem.glyph}</div><div><div class="lbl">🧠 احفظها في عقلك</div><h4>${mem.title}</h4><q>${mem.text}</q></div></div></div>` : ''}
        <section class="panel"><div class="row" style="margin-top:0">
          <span class="chip">⭐ +${ar(xp)} خبرة</span>${logic ? `<span class="chip">🧠 +${ar(logic)} تفكير منطقي</span>` : ''}<span class="chip">⚡ ${ar(Math.round(ms / 1000))} ث</span>
          <span class="chip" aria-label="${ar(stars)} نجوم">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span></div>
          <p class="muted small" style="margin-top:10px">${fails ? `جرّبت ${ar(fails + 1)} مرات حتى نجحت. هكذا يعمل المبرمجون: تجربة، ثم فحص، ثم إصلاح.` : 'نجحت من أول محاولة! عقلك المنطقي يعمل بقوة.'}</p>
          <div class="row">${next ? `<button class="btn royal" data-go="m:${next.id}">المهمة التالية: ${next.title} ←</button>` : `<button class="btn royal" data-go="${back}">رجوع إلى الخريطة ←</button>`}
          <button class="btn ghost" data-go="m:${id}">العب مرة أخرى ↻</button></div></section>`);
      if (after.n > before) later(() => toast(`🏆 مستوى جديد: <span class="xp">م${ar(after.n)} · ${after.title}</span>`), 900);
      else later(() => toast(`<span class="xp">+${ar(xp)} ⭐</span> ${def.title} اكتملت`), 600);
    }
  };
  MECH[def.mech](ctx);
};

/* ---------- shared: tap (or drag) a card, then a zone ---------- */
function pairPick(cardsHost, zones, onDrop) {
  let sel = null;
  const clear = () => { $$('.card', cardsHost).forEach(c => c.classList.remove('sel')); zones.forEach(z => z.classList.remove('ready')); };
  cardsHost.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c || c.disabled) return;
    clear(); sel = c; c.classList.add('sel'); zones.forEach(z => z.classList.add('ready')); sfx.tap();
  });
  cardsHost.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; sel = c; e.dataTransfer.setData('text/plain', c.dataset.k || ''); zones.forEach(z => z.classList.add('ready')); });
  zones.forEach(z => {
    const act = () => { if (!sel) return false; const c = sel; sel = null; clear(); onDrop(c, z); return true; };
    z.addEventListener('click', () => { if (!act()) shake(z); });
    z.addEventListener('dragover', e => e.preventDefault());
    z.addEventListener('drop', e => { e.preventDefault(); act(); });
    z.setAttribute('tabindex', '0'); z.setAttribute('role', 'button');
    z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  });
}
/* ordered builder: tap pool cards to append; tap a placed card to return it */
function orderBuilder(host, items, onChange) {
  let pool = shuffle(items), seq = [];
  host.innerHTML = `<div class="two"><div><span class="lbl">البطاقات</span><div class="cards b-pool"></div></div><div><span class="lbl">خوارزميتك</span><ol class="slots b-seq"></ol></div></div>`;
  const P = $('.b-pool', host), Q = $('.b-seq', host);
  const api = { locked: false, get seq() { return seq; }, mark(i, c) { const el = Q.children[i]?.querySelector('.card'); if (el) el.classList.add(c); }, unmark() { $$('.card', Q).forEach(c => c.classList.remove('on', 'ok', 'bad')); } };
  const draw = () => {
    P.innerHTML = pool.map(it => `<button class="card" data-id="${it.id}">${it.t}</button>`).join('') || '<span class="muted small">كل البطاقات في مكانها ✓</span>';
    Q.innerHTML = seq.map(it => `<li><button class="card" data-id="${it.id}">${it.t}</button></li>`).join('') + (pool.length ? `<li class="empty">${seq.length ? 'الخطوة التالية…' : 'اضغط بطاقة لتضعها هنا'}</li>` : '');
    onChange && onChange(seq, pool);
  };
  P.onclick = e => { const b = e.target.closest('[data-id]'); if (!b || api.locked) return; const i = pool.findIndex(x => String(x.id) === b.dataset.id); seq.push(pool.splice(i, 1)[0]); sfx.tap(); draw(); };
  Q.onclick = e => { const b = e.target.closest('[data-id]'); if (!b || api.locked) return; const i = seq.findIndex(x => String(x.id) === b.dataset.id); pool.push(seq.splice(i, 1)[0]); draw(); };
  draw(); return api;
}

/* ---------- grid world (robot + battery) ---------- */
const DIRS = { U: [0, -1, '⬆️', 'تقدّم'], D: [0, 1, '⬇️', 'ارجع'], R: [1, 0, '➡️', 'يمين'], L: [-1, 0, '⬅️', 'يسار'] };

    const k = x + ',' + y, w = walls.has(k), g = x === L.goal[0] && y === L.goal[1];
    cells += `<div class="cell${w ? ' wall' : ''}${g ? ' goal' : ''}${roads.has(k) ? ' road' : ''}" data-k="${k}">${w ? (opt.wallIcon || '') : g ? (opt.goalIcon || '🔋') : (L.deco && L.deco[k]) || ''}</div>`;

  const B = $('.gbot', host); let pos;
  const place = (x, y) => { pos = [x, y]; B.style.setProperty('--x', x); B.style.setProperty('--y', y); };
  const mood = m => { B.innerHTML = robot(m, 44); };
  const trail = (x, y, on) => { const c = $(`.cell[data-k="${x},${y}"]`, host); if (c && !c.classList.contains('goal')) c.classList.toggle('trail', on); };
  function reset() { $$('.cell.trail', host).forEach(c => c.classList.remove('trail')); B.classList.add('nomove'); place(L.start[0], L.start[1]); void B.offsetWidth; B.classList.remove('nomove'); mood('happy'); }
  async function run(cmds, onStep, speed = 400) {
    reset(); await wait(250);
    for (let i = 0; i < cmds.length; i++) {

const gridWhy = r => r.why === 'short' ? 'انتهت الأوامر… والروبوت لم يصل بعد.' : r.why === 'wall' ? `اصطدم الروبوت بجدار عند الأمر رقم <b>${ar(r.i + 1)}</b> 💥` : `خرج الروبوت من حدود المتاهة عند الأمر رقم <b>${ar(r.i + 1)}</b>`;

/* program editor: plain blocks + optional loop blocks. items: {t:'U'} | {t:'loop', n, body:[{t}]} */
function progEditor(host, { allowLoop = false, max = 24, onChange } = {}) {
  let prog = [], open = -1, locked = false;
  host.innerHTML = `<span class="lbl">الأوامر · اضغط لإضافتها</span><div class="palette">${['U', 'D', 'R', 'L'].map(k => `<button class="blk" data-add="${k}">${dl(k)}</button>`).join('')}${allowLoop ? '<button class="blk loop" data-loop>🔁 كرر</button>' : ''}</div>
    <span class="lbl" style="margin-top:12px">برنامجك <span class="cnt"></span></span><div class="prog"></div>`;
  const P = $('.prog', host);
  const count = () => prog.reduce((s, it) => s + (it.t === 'loop' ? 1 + it.body.length : 1), 0);
  function flat() { const f = []; prog.forEach((it, i) => { if (it.t === 'loop') { for (let r = 0; r < it.n; r++) it.body.forEach((b, j) => f.push({ c: b.t, ref: [i, j], rep: r })); } else f.push({ c: it.t, ref: [i, null] }); }); return f; }
  function draw() {
    $('.cnt', host).textContent = `(${ar(count())} قطعة)`;
    P.innerHTML = prog.map((it, i) => it.t === 'loop'
      ? `<span class="loopgrp" data-i="${i}"><span class="lx">🔁 كرر</span><span class="counter"><button data-dec="${i}" aria-label="أقل">−</button><b>${ar(it.n)}</b><button data-inc="${i}" aria-label="أكثر">+</button></span><span class="lx">مرات:</span>${it.body.map((b, j) => `<button class="blk" data-i="${i}" data-j="${j}">${dl(b.t)}</button>`).join('') || '<span class="ph">ضع الأوامر هنا</span>'}${open === i ? `<button class="btn sm ghost" data-close="${i}">تم ✓</button>` : `<button class="btn sm ghost" data-open="${i}">✎</button>`}<button class="btn sm ghost" data-del="${i}" aria-label="حذف الحلقة">✕</button></span>`
      : `<button class="blk" data-i="${i}">${dl(it.t)}</button>`).join('') || '<span class="ph">برنامجك فارغ… اضغط الأوامر بالأعلى</span>';
    onChange && onChange();
  }
  host.addEventListener('click', e => {
    if (locked) return;
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.add) { if (count() >= max) return; if (open >= 0) prog[open].body.push({ t: d.add }); else prog.push({ t: d.add }); sfx.tap(); }
    else if ('loop' in d) { if (count() >= max) return; prog.push({ t: 'loop', n: 2, body: [] }); open = prog.length - 1; sfx.tap(); }
    else if (d.inc) prog[+d.inc].n = Math.min(12, prog[+d.inc].n + 1);
    else if (d.dec) prog[+d.dec].n = Math.max(1, prog[+d.dec].n - 1);
    else if (d.close) open = -1;
    else if (d.open) open = +d.open;
    else if (d.del) { prog.splice(+d.del, 1); open = -1; }
    else if (d.i !== undefined && t.classList.contains('blk')) { if (d.j !== undefined) prog[+d.i].body.splice(+d.j, 1); else { prog.splice(+d.i, 1); if (open > +d.i) open--; } }
    else return;
    draw();
  });
  draw();

    get prog() { return prog; }, set prog(p) { prog = p; open = -1; draw(); }, count, flat,
    lock(v) { locked = v; }, clear() { prog = []; open = -1; draw(); },
    mark(ref, cls) { $$('.blk', P).forEach(b => b.classList.remove('on', 'bad')); if (!ref) return; const sel = ref[1] === null ? `.blk[data-i="${ref[0]}"]:not([data-j])` : `.blk[data-i="${ref[0]}"][data-j="${ref[1]}"]`; const el = $(sel, P); if (el) el.classList.add(cls); }

/* ---------- t3: IF / ELSE number decision ---------- */

  ctx.host.innerHTML = `<div class="two"><div><span class="lbl">الرقم الذي يراه الروبوت</span><div class="bignum num" id="nv">${ar(v)}</div><input type="range" id="nr" min="0" max="10" value="${v}" aria-label="الرقم">

    <div><div class="flowq"><div class="branch yes" id="by"><small>IF · نعم</small>🟢 الرقم كبير</div><div class="diamond"><span id="dq">${ar(v)} &gt; ٥ ؟</span></div><div class="branch no" id="bn"><small>ELSE · لا</small>🔵 الرقم صغير</div></div>

    $('#out').textContent = big ? '🟢 الرقم كبير' : '🔵 الرقم صغير';
  }
  $('#nr').oninput = () => { v = +$('#nr').value; decide(); moved.add(v > 5); if (v === 5) ctx.info('لاحظ الرقم ٥: هل ٥ أكبر من ٥؟ لا، لذلك ذهب إلى «وإلا».'); if (moved.size === 2 && !quiz) startQuiz(); };

        else ctx.fail(it.n === 5 ? '٥ ليس أكبر من ٥، فيذهب إلى «وإلا».' : `هل ${ar(it.n)} أكبر من ٥؟ فكّر مرة أخرى.`, { noCheck: true });

/* ---------- t4: ELSE IF thermometer ---------- */
MECH.elseIf = ctx => {
  let t = 20, busy = false, phase = 1; const seen = new Set();
  const GOOD = [[35, 'حار جدًا 🔥'], [25, 'معتدل ☀️'], [null, 'بارد ❄️']];
  const BAD = [[25, 'معتدل ☀️'], [35, 'حار جدًا 🔥'], [null, 'بارد ❄️']];
  function view() {
    const C = phase === 1 ? GOOD : BAD;
    ctx.host.innerHTML = `${phase === 2 ? '<p class="bigq">🛠️ زميلك قلب ترتيب الشروط! جرّب ٤٠° وشاهد ماذا يحدث، ثم أصلحه.</p>' : ''}
      <div class="thermo"><div><div class="tube"><i id="tf"></i></div><div class="tval num" id="tv">${ar(t)}°</div></div>
      <div><input type="range" id="tr" min="0" max="50" value="${t}" aria-label="درجة الحرارة"><div class="chain" id="ch" style="margin-top:8px">${C.map(([v, o], i) => `<div class="crow"><span class="cc">${v === null ? '<span style="color:var(--amber-d)">وإلا</span>' : `<span style="color:var(--royal)">${i ? 'وإلا إذا' : 'إذا'}</span> الحرارة ≥ ${ar(v)}°`} ← «${o}»</span><span class="cr"></span></div>`).join('')}</div>
      <div class="row"><button class="btn emerald" id="go">▶ افحص</button>${phase === 2 ? '<button class="btn amber" id="fix">⇅ بدّل أول شرطين</button>' : ''}</div><div class="out" id="out">—</div></div></div>`;
    const set = () => { $('#tv').textContent = ar(t) + '°'; $('#tf').style.height = Math.max(6, t / 50 * 96) + '%'; };
    $('#tr').oninput = () => { t = +$('#tr').value; set(); }; set();
    $('#go').onclick = () => check(C);
    if ($('#fix')) $('#fix').onclick = () => { if (busy) return; phase = 3; ctx.ok('بدّلت الترتيب: الشرط الأصعب (≥ ٣٥) صار أولًا. جرّب ٤٠° مرة أخرى.'); viewFixed(); };
  }
  function viewFixed() { phase = 1; view(); phase = 3; $('#go').onclick = () => check(GOOD); }
  async function check(C) {
    if (busy) return; busy = true; ctx.clear();
    const rows = $$('#ch .crow'); rows.forEach(r => { r.className = 'crow'; $('.cr', r).textContent = ''; });
    let out = '';
    for (let i = 0; i < C.length; i++) {

      const ok = v === null || t >= v; rows[i].classList.add(ok ? 't' : 'f'); $('.cr', rows[i]).textContent = v === null ? 'نُفِّذ' : ok ? 'صحيح ✓' : 'خطأ ✗';
      if (ok) { out = o; for (let j = i + 1; j < rows.length; j++) { rows[j].classList.add('skip'); $('.cr', rows[j]).textContent = 'لم يُفحص'; } break; }
    }

    if (phase === 1) {

      if (seen.size === 3) { ctx.say('لاحظت؟ أفحص من <b>الأعلى إلى الأسفل</b>، وأتوقف عند أول شرط صحيح.', 'wow'); ctx.reveal(); later(() => { phase = 2; t = 40; view(); }, 1800); }
      else if (seen.size === 2) ctx.info('بقيت نتيجة واحدة لم تظهر بعد!');
    } else if (phase === 2) {
      if (t >= 35) { ctx.bug(); ctx.say('٤٠° وأقول «معتدل»؟! 🥵 الشرط ≥ ٢٥ جاء أولًا وكان صحيحًا، فتوقفت عنده.', 'dizzy'); fbox(ctx.fbEl, 'هذا <b>خطأ منطقي</b>: البرنامج يعمل، لكن النتيجة خاطئة. اضغط «⇅ بدّل أول شرطين».', 'bad'); }
      else ctx.info('جرّب حرارة عالية مثل ٤٠° لترى المشكلة.');
    } else if (phase === 3) {
      if (t >= 35) { ctx.ok('٤٠° ← «حار جدًا 🔥». الترتيب الصحيح أصلح البرنامج!'); ctx.complete(); }
      else ctx.info('جرّب ٤٠° للتأكد من الإصلاح.');

};

        $('#fx').onclick = ev => { const b = ev.target.closest('.card'); if (!b || b.disabled) return; if (+b.dataset.j === p.ok) { fixed = true; draw(); $('#fx').innerHTML = ''; ctx.info('أصلحته! الآن شغّل البرنامج للتأكد ▶'); } else { b.classList.add('bad'); b.disabled = true; ctx.fail('هذا التغيير لا يحل المشكلة، وقد يصنع مشكلة جديدة!', { noCheck: true }); } };

};

    <span class="st">${r.done ? '★'.repeat(r.stars) : open ? '▶' : ''}</span></button></li>`;
}

/* ---------- teacher dashboard ----------
   Reads every student's progress/<id> doc. Only the owner and editors can read them (db rules). */
function analyze(students) {
  const ms = CONTENT.missions, byC = {};
  ms.forEach(m => { (byC[m.concept] = byC[m.concept] || []).push(m.id); });
  const rows = students.map(s => {
    const mm = s.missions || {}; const done = ms.filter(m => mm[m.id]?.done).length;
    const attempts = Object.values(mm).reduce((a, m) => a + (m.attempts || 0), 0);
    const mastered = [], struggled = [];
    for (const [c, ids] of Object.entries(byC)) {
      if (ids.every(id => mm[id]?.done && (mm[id].stars || 0) >= 2)) mastered.push(c);
      if (ids.some(id => (mm[id]?.fails || 0) >= 3 || (mm[id]?.hints || 0) >= 2)) struggled.push(c);
    }
    return { ...s, done, pct: Math.round(done / ms.length * 100), attempts, mastered, struggled, lvl: levelInfo(s.xp || 0) };
  });
  const concept = Object.entries(byC).map(([c, ids]) => {
    let sum = 0, n = 0; rows.forEach(r => ids.forEach(id => { const m = (r.missions || {})[id]; sum += m?.done ? (m.stars || 1) / 3 : 0; n++; }));
    return { c, v: n ? Math.round(sum / n * 100) : 0 };
  });
  const hard = ms.map(m => { let f = 0, n = 0; rows.forEach(r => { const x = (r.missions || {})[m.id]; if (x && x.attempts) { f += x.fails || 0; n++; } }); return { m, v: n ? +(f / n).toFixed(1) : 0, n }; })
    .filter(x => x.n).sort((a, b) => b.v - a.v).slice(0, 5);
  return { rows, concept, hard };
}
function demoStudents() {
  const names = ['طالب ١ (مثال)', 'طالب ٢ (مثال)', 'طالب ٣ (مثال)', 'طالب ٤ (مثال)', 'طالب ٥ (مثال)', 'طالب ٦ (مثال)'];
  return names.map((name, k) => {
    const missions = {}; const reach = [4, 9, 14, 7, 18, 11][k];
    CONTENT.missions.slice(0, reach).forEach((m, i) => { const f = (k * 7 + i * 3) % 5; missions[m.id] = { done: true, stars: f > 2 ? 1 : f > 0 ? 2 : 3, attempts: 1 + (f > 2 ? 2 : 0), fails: f, hints: f > 3 ? 2 : f > 1 ? 1 : 0 }; });
    const xp = Object.values(missions).length * 50; return { name, xp, logic: reach * 2, bugs: Math.floor(reach / 3), missions, updatedAt: Date.now() - k * 36e5 * 5 };
  });
}
let tipEl = null;
function tip(e, text) { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); } tipEl.textContent = text; tipEl.style.left = e.clientX + 'px'; tipEl.style.top = e.clientY + 'px'; tipEl.hidden = false; }
document.addEventListener('pointerover', e => { const b = e.target.closest('[data-tip]'); if (b) tip(e, b.dataset.tip); else if (tipEl) tipEl.hidden = true; });
document.addEventListener('pointermove', e => { if (tipEl && !tipEl.hidden && e.target.closest('[data-tip]')) { tipEl.style.left = e.clientX + 'px'; tipEl.style.top = e.clientY + 'px'; } });

ROUTES.teacher = async (arg) => {

  app.innerHTML = hud('👩‍🏫 لوحة المعلم', 'home') + '<div id="tv"><section class="panel"><p class="muted">جارٍ تحميل تقدّم الطلاب…</p></section></div>';
  let students = [], note = '';
  if (demo) { students = demoStudents(); note = 'بيانات توضيحية لأسماء غير حقيقية، لترى شكل اللوحة. ستظهر بيانات طلابك الحقيقيين هنا عندما يلعبون.'; }

  else {

  }
  function render(list, note) {
    const A = analyze(list); const R = A.rows.sort((a, b) => b.pct - a.pct);

    const avgM = A.concept.length ? Math.round(A.concept.reduce((s, c) => s + c.v, 0) / A.concept.length) : 0;
    const totalBugs = R.reduce((s, r) => s + (r.bugs || 0), 0), totalAtt = R.reduce((s, r) => s + r.attempts, 0);
    $('#tv').innerHTML = `${note ? `<div class="demo-note">⚠️ ${note}</div>` : ''}
      <div class="tgrid">
        <div class="stat"><span class="v num">${ar(R.length)}</span><span class="l">طالب</span></div>
        <div class="stat"><span class="v num">${ar(avg)}٪</span><span class="l">متوسط التقدّم</span></div>
        <div class="stat"><span class="v num">${ar(avgM)}٪</span><span class="l">متوسط إتقان المفاهيم</span></div>
        <div class="stat"><span class="v num">${ar(totalAtt)}</span><span class="l">محاولات · 🐞 ${ar(totalBugs)} خطأ مكتشف</span></div></div>
      <div class="two">
        <section class="panel"><h3>إتقان كل مفهوم</h3><p class="small muted">متوسط الطلاب، ويُحسب من المهام المكتملة ونجومها</p><div class="bars" style="margin-top:12px">
          ${A.concept.sort((a, b) => a.v - b.v).map(c => `<div class="hbar" data-tip="${CONCEPTS[c.c]}: ${c.v}٪"><span>${CONCEPTS[c.c]}</span><span class="t"><i style="width:${c.v}%;background:${c.v < 40 ? 'var(--amber)' : 'var(--royal)'}"></i></span><span class="vlab num">${ar(c.v)}٪</span></div>`).join('')}</div>

        <section class="panel"><h3>أكثر التحديات صعوبة</h3><p class="small muted">متوسط المحاولات الخاطئة لكل طالب جرّب المهمة</p><div class="bars" style="margin-top:12px">
          ${A.hard.length ? (() => { const mx = Math.max(1, ...A.hard.map(h => h.v)); return A.hard.map(h => `<div class="hbar" data-tip="${h.m.title}: ${h.v} محاولة خاطئة في المتوسط"><span>${h.m.icon} ${h.m.title}</span><span class="t"><i style="width:${h.v / mx * 100}%;background:var(--amber)"></i></span><span class="vlab num">${ar(h.v)}</span></div>`).join(''); })() : '<p class="muted">لا توجد بيانات كافية بعد.</p>'}</div></section></div>

        <p class="small muted">اضغط على طالب لترى تفاصيله.</p>
        <div class="tablewrap"><table class="stable"><thead><tr><th>الطالب</th><th>التقدّم</th><th>المستوى</th><th>أتقن</th><th>واجه صعوبة في</th><th>المحاولات</th></tr></thead><tbody>
        ${R.map((r, i) => `<tr data-i="${i}"><td><b>${esc(r.name || 'طالب بدون اسم')}</b></td><td class="num">${ar(r.pct)}٪<span class="mini"><i style="width:${r.pct}%"></i></span></td><td>م${ar(r.lvl.n)}</td>

        </tbody></table></div><div id="detail"></div></section>`;
    $('.stable tbody').onclick = e => {
