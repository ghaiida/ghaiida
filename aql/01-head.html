<title>مهمة عقل المبرمج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a bright "control room" — light circuit-grid ground, one centered column of mission screens, a sticky HUD on top. Single committed light look. */
:root{
  --ground:#F3F6FD; --grid:#E3EAF8; --panel:#FFFFFF; --line:#D5DEF0; --line-2:#B9C6E2;
  --ink:#0E1B3D; --ink-2:#4A5677; --ink-3:#7A86A6;
  --royal:#1F4FD8; --royal-d:#0E2E8F; --royal-t:#E7EDFF;
  --emerald:#0E9F7A; --emerald-d:#06704F; --emerald-t:#DDF6EE;
  --amber:#F2A12E; --amber-d:#B86E00; --amber-t:#FFF2DB;
  --rose:#E0475B; --rose-t:#FDE7EA;
  --term:#0F1E44; --term-ink:#E6ECFF; --term-dim:#8D9BC7;
  --f-display:"Cairo","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Cairo","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{direction:rtl}
body{background-color:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 1.3px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,128px 128px,128px 128px;background-attachment:fixed}
#app{max-width:960px;margin-inline:auto;padding-inline:16px;padding-block:0 80px;min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0 0 .5em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.num,.tab{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* 3D buttons */
.btn{--c:var(--panel);--cd:var(--line-2);--fg:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.2;
  border:0;border-radius:14px;padding:.75em 1.3em;background:var(--c);color:var(--fg);cursor:pointer;position:relative;
  box-shadow:0 5px 0 var(--cd),0 10px 20px rgba(14,27,61,.12);transform:translateY(0);transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 6px 0 var(--cd),0 14px 24px rgba(14,27,61,.16)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cd),0 4px 8px rgba(14,27,61,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.royal{--c:var(--royal);--cd:var(--royal-d);--fg:#fff}
.btn.emerald{--c:var(--emerald);--cd:var(--emerald-d);--fg:#fff}
.btn.amber{--c:var(--amber);--cd:var(--amber-d);--fg:var(--ink)}
.btn.ghost{--c:transparent;--cd:transparent;box-shadow:none;border:2px solid var(--line-2)}
.btn.sm{font-size:.88rem;padding:.5em .9em;border-radius:11px}
.btn.lg{font-size:1.2rem;padding:.9em 1.8em;border-radius:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.row.c{justify-content:center}
.spacer{flex:1}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;margin-bottom:8px;
  background:linear-gradient(var(--ground) 70%,rgba(243,246,253,0))}
.hud .back{flex:none;width:44px;height:44px;border-radius:13px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--line-2);cursor:pointer;font-size:1.2rem;font-weight:800}
.hud-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.86rem;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.chip .k{font-size:.95rem}
.lvl-chip{background:var(--royal);color:#fff;box-shadow:0 2px 0 var(--royal-d)}
@media(max-width:560px){.chip.opt{display:none}}

/* panels */
.panel{background:var(--panel);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(14,27,61,.06);margin-bottom:18px;position:relative}
.panel h3{font-size:1.25rem;margin-bottom:4px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.06em;color:var(--royal);text-transform:uppercase}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.tag{display:inline-block;font-weight:800;font-size:.78rem;border-radius:999px;padding:2px 10px;background:var(--royal-t);color:var(--royal-d)}
.tag.em{background:var(--emerald-t);color:var(--emerald-d)}
.tag.am{background:var(--amber-t);color:var(--amber-d)}

/* robot guide */
.guide{display:flex;gap:14px;align-items:flex-end;margin-block:6px 18px}
.guide .rb{flex:none}
.say{flex:1;min-width:0;background:var(--panel);border-radius:20px 20px 6px 20px;padding:14px 18px;box-shadow:0 1px 0 var(--line),0 8px 20px rgba(14,27,61,.07);font-size:1.05rem;position:relative}
.say b{color:var(--royal-d)}
.rb svg{display:block;filter:drop-shadow(0 10px 12px rgba(14,27,61,.18))}
.rb.idle svg{animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.rb.shake svg{animation:shake .4s}
.rb.jump svg{animation:jump .5s}
@keyframes jump{40%{transform:translateY(-16px) scale(1.04)}}
@keyframes shake{20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shakeit{animation:shake .4s}

/* feedback & hints */
.fb{margin-top:14px;padding:12px 16px;border-radius:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;animation:rise .3s var(--ease)}
.fb.ok{background:var(--emerald-t);color:var(--emerald-d)}
.fb.bad{background:var(--amber-t);color:#7A4A00}
.fb.info{background:var(--royal-t);color:var(--royal-d)}
.fb .i{font-size:1.2rem;line-height:1.4}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hintbox{margin-top:12px;border:2px dashed var(--amber);border-radius:14px;padding:10px 14px;background:var(--amber-t)}
.hintbox .hl{font-weight:800;color:var(--amber-d);font-size:.85rem}
.hintbtn{position:absolute;top:14px;inset-inline-end:14px}

/* reveal (discover → explain) */
.reveal{border-radius:var(--r);padding:22px;margin-bottom:18px;background:linear-gradient(135deg,var(--royal) 0%,#2D63F0 55%,var(--emerald) 140%);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(31,79,216,.25);animation:rise .45s var(--ease)}
.reveal::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:24px solid rgba(255,255,255,.08)}
.reveal .k{font-family:var(--f-display);font-weight:800;font-size:.85rem;opacity:.85}
.reveal h2{font-size:clamp(1.4rem,4vw,2rem);margin-block:2px 8px}
.reveal p{max-width:62ch;font-size:1.08rem}
.reveal .eq{display:inline-block;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-block:6px}
.life{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.life span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem}

/* memory card */
.memcard{perspective:900px;margin-bottom:18px}
.memcard-in{background:var(--panel);border-radius:22px;padding:22px 22px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;
  box-shadow:0 2px 0 var(--amber),0 18px 36px rgba(242,161,46,.18);border:2px solid var(--amber);transform-origin:center;animation:flip .7s var(--ease)}
@keyframes flip{from{transform:rotateX(-80deg);opacity:0}to{transform:none;opacity:1}}
.memcard .glyph{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(145deg,var(--amber-t),#FFE2AE);box-shadow:inset 0 -6px 0 rgba(184,110,0,.15)}
.memcard .lbl{font-family:var(--f-display);font-weight:800;color:var(--amber-d);font-size:.85rem}
.memcard h4{font-size:1.25rem}
.memcard q{display:block;font-size:1.15rem;font-weight:700;quotes:"«" "»";margin-top:2px}
@media(max-width:520px){.memcard-in{grid-template-columns:1fr;text-align:center}.memcard .glyph{margin-inline:auto}}

/* reward toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;display:flex;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(14,27,61,.35);animation:toast 2.6s var(--ease) forwards;max-width:calc(100% - 32px)}
.toast .xp{color:var(--amber);font-family:var(--f-display)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.burst i{position:absolute;width:9px;height:9px;border-radius:2px;top:45%;left:50%;animation:burst 1.1s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(400deg);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
