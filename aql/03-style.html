<style>
/* ===== loop: boxes ===== */
.boxes{direction:ltr;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-block:10px}
.box{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:clamp(.9rem,3.6vw,1.6rem);background:linear-gradient(160deg,#C98A3E,#9A5F1E);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 8px rgba(14,27,61,.12);transition:transform .3s var(--ease),background .3s}
.box.open{background:linear-gradient(160deg,var(--amber-t),#FFE0A3);transform:translateY(-4px) rotate(-3deg)}
.box.cur{outline:3px solid var(--royal);outline-offset:2px}
.cmdlog{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;padding:8px;border-radius:12px;background:#FBFCFF;border:2px dashed var(--line-2);min-height:48px}
.cmdlog span{background:var(--royal);color:#fff;border-radius:9px;padding:2px 10px;font-weight:800;font-size:.85rem}
.loopcard{display:flex;flex-direction:column;gap:6px;background:var(--emerald);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 var(--emerald-d)}
.loopcard .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.loopcard .lb{background:rgba(255,255,255,.95);color:var(--ink);border-radius:12px;padding:8px 10px;margin-inline-start:18px;display:flex;flex-wrap:wrap;gap:6px;min-height:46px;align-items:center}
.loopcard .counter{box-shadow:none;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--royal);height:28px}

/* ===== loop: dance ===== */
.dancefloor{position:relative;height:230px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3E5BD6 0%,#1B2C70 55%,#101A45 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dancefloor .tiles{position:absolute;inset:auto 0 0 0;height:60px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 50px,rgba(255,255,255,.02) 50px 100px);transform:perspective(200px) rotateX(40deg);transform-origin:bottom}
.dancefloor .spot{position:absolute;top:-40px;width:160px;height:300px;background:linear-gradient(rgba(242,161,46,.35),transparent);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);opacity:0;transition:opacity .3s}
.dancefloor.beat .spot{opacity:1}
.dancer{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);transition:transform .28s var(--ease)}
.dancer.R{transform:translateX(calc(-50% + 60px)) rotate(8deg)}
.dancer.L{transform:translateX(calc(-50% - 60px)) rotate(-8deg)}
.dancer.J{transform:translateX(-50%) translateY(-60px) scale(1.05)}
.dancer.S{transform:translateX(-50%) rotate(360deg)}
.notes{position:absolute;top:12px;right:14px;color:#fff;font-size:1.4rem;opacity:.8}
.beatbar{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.beatbar i{font-style:normal;min-width:44px;text-align:center;border-radius:10px;padding:4px 8px;background:var(--royal-t);font-weight:800;font-size:.85rem;transition:background .2s}
.beatbar i.on{background:var(--amber)}
.beatbar i.ok{background:var(--emerald-t)}

/* ===== if: scenes ===== */
.street{position:relative;height:200px;border-radius:20px;overflow:hidden;background:linear-gradient(#BFE1FF,#EEF7FF);transition:background .5s;direction:ltr}
.street.rain{background:linear-gradient(#6E7FA3,#B9C4DB)}
.street .rainfx{position:absolute;inset:0;opacity:0;transition:opacity .4s;background-image:repeating-linear-gradient(100deg,transparent 0 12px,rgba(255,255,255,.7) 12px 14px);background-size:50px 50px;animation:rain .45s linear infinite}
.street.rain .rainfx{opacity:1}
@keyframes rain{to{background-position:-16px 50px}}
.street .sun{position:absolute;top:14px;right:22px;font-size:2.6rem;transition:opacity .4s}
.street.rain .sun{opacity:0}
.street .ground{position:absolute;inset:auto 0 0 0;height:38px;background:linear-gradient(#9AD6A0,#6FBF7A)}
.street .door{position:absolute;bottom:30px;left:16px;font-size:3.4rem}
.street .who{position:absolute;bottom:34px;right:24px;transition:right 1.4s var(--ease);width:72px}
.street .who.go{right:calc(100% - 170px)}
.street .who .itm{position:absolute;top:-30px;left:6px;font-size:2.2rem}
.ruleslot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.drop{min-width:150px;min-height:44px;border:2px dashed var(--line-2);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;color:var(--ink-3);font-size:.92rem;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}
.drop.ready{border-color:var(--royal);background:var(--royal-t)}
.drop.filled{border-style:solid;border-color:var(--emerald);background:var(--emerald-t);color:var(--ink)}
.gatebox{position:relative;height:210px;border-radius:20px;overflow:hidden;background:linear-gradient(#EAF0FF,#D6E1FB);direction:ltr}
.gatebox .wallL,.gatebox .wallR{position:absolute;bottom:0;width:calc(50% - 50px);height:150px;background:linear-gradient(145deg,#2B3A66,#16224A)}
.gatebox .wallL{left:0}.gatebox .wallR{right:0}
.gatebox .bars{position:absolute;bottom:0;left:calc(50% - 50px);width:100px;height:150px;background:repeating-linear-gradient(90deg,#8B97B8 0 8px,transparent 8px 20px);transition:transform .7s var(--ease);border-top:8px solid #5C6A92}
.gatebox.open .bars{transform:translateY(-150px)}
.gatebox .sign{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--term);color:var(--term-ink);border-radius:10px;padding:4px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.gatebox .hero{position:absolute;bottom:6px;right:20px;transition:right 1.2s var(--ease);width:64px}
.gatebox.pass .hero{right:calc(50% - 32px)}
.gatebox.through .hero{right:calc(100% - 90px)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tgl{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 14px;background:var(--panel);cursor:pointer;box-shadow:0 3px 0 var(--line-2)}
.tgl.on{background:var(--royal);color:#fff;box-shadow:0 3px 0 var(--royal-d)}
.flowq{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.diamond{width:120px;height:120px;transform:rotate(45deg);border-radius:18px;background:var(--royal);display:grid;place-items:center;box-shadow:0 8px 0 var(--royal-d);margin:14px}
.diamond span{transform:rotate(-45deg);color:#fff;font-family:var(--f-display);font-weight:800;text-align:center;font-size:.92rem;line-height:1.3;max-width:100px}
.branch{border-radius:16px;padding:12px;text-align:center;font-weight:800;background:var(--panel);box-shadow:0 1px 0 var(--line);opacity:.45;transition:opacity .25s,transform .25s,background .25s}
.branch.lit{opacity:1;transform:scale(1.04)}
.branch.yes.lit{background:var(--emerald-t);box-shadow:0 0 0 3px var(--emerald)}
.branch.no.lit{background:var(--royal-t);box-shadow:0 0 0 3px var(--royal)}
.branch small{display:block;font-family:var(--f-display);font-size:.75rem;color:var(--ink-2)}
.bignum{font-family:var(--f-display);font-weight:900;font-size:3.6rem;line-height:1;text-align:center}
@media(max-width:520px){.flowq{grid-template-columns:1fr}.diamond{margin-inline:auto}}

/* thermometer */
.thermo{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:stretch}
.tube{position:relative;width:40px;margin-inline:auto;height:220px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px var(--ink)}
.tube i{position:absolute;bottom:4px;left:4px;right:4px;border-radius:16px;background:linear-gradient(0deg,var(--rose),var(--amber));transition:height .3s var(--ease)}
.tube::after{content:"";position:absolute;bottom:-18px;left:-8px;width:56px;height:56px;border-radius:50%;background:var(--rose);box-shadow:inset 0 0 0 3px var(--ink)}
.tval{font-family:var(--f-display);font-weight:900;font-size:1.6rem;text-align:center;margin-top:26px}
.chain{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:14px;padding:10px 14px;background:var(--panel);box-shadow:0 1px 0 var(--line);transition:background .2s,opacity .2s,box-shadow .2s}
.crow .cc{font-weight:800}
.crow .cr{font-weight:800;font-size:.85rem;border-radius:999px;padding:2px 10px;background:var(--ground);white-space:nowrap}
.crow.chk{box-shadow:0 0 0 3px var(--amber)}
.crow.t{background:var(--emerald-t);box-shadow:0 0 0 3px var(--emerald)}
.crow.t .cr{background:var(--emerald);color:#fff}
.crow.f .cr{background:var(--rose-t);color:var(--rose)}
.crow.skip{opacity:.4}
.out{margin-top:12px;border-radius:16px;padding:14px;text-align:center;font-family:var(--f-display);font-weight:900;font-size:1.5rem;background:var(--term);color:var(--term-ink)}
@media(max-width:520px){.thermo{grid-template-columns:1fr}}

/* variables */
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;perspective:800px}
.vbox{position:relative;border-radius:18px;padding:30px 12px 14px;text-align:center;background:linear-gradient(160deg,#FFFFFF,#EEF3FF);box-shadow:0 6px 0 var(--line-2),0 14px 26px rgba(14,27,61,.1);transform-style:preserve-3d}
.vbox::before{content:"";position:absolute;top:-10px;left:12px;right:12px;height:22px;border-radius:10px 10px 6px 6px;background:linear-gradient(var(--royal),var(--royal-d));transform:rotateX(30deg);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.vbox .vn{font-weight:800;color:var(--ink-2);font-size:.88rem}
.vbox .vv{font-family:var(--f-display);font-weight:900;font-size:1.8rem;line-height:1.3;word-break:break-word}
.vbox.pulse{animation:vpulse .6s var(--ease)}
@keyframes vpulse{30%{transform:translateY(-10px) scale(1.05);box-shadow:0 6px 0 var(--amber),0 20px 30px rgba(242,161,46,.35)}}
.vbox input{font:inherit;font-weight:800;width:100%;border:2px solid var(--line-2);border-radius:10px;padding:4px 8px;text-align:center;margin-top:6px;background:#fff;color:var(--ink)}
.coinfield{position:relative;height:150px;border-radius:18px;background:linear-gradient(#FFF7E8,#FFEFD1);overflow:hidden;cursor:crosshair}
.coin{position:absolute;width:44px;height:44px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C4,var(--amber) 55%,var(--amber-d));box-shadow:0 4px 0 #8A5200;font-weight:900;cursor:pointer;color:var(--ink);font-size:.8rem}
.coin.got{animation:coin .5s forwards}
@keyframes coin{to{transform:translateY(-60px) scale(.3);opacity:0}}

/* input / output machine */
.machine{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center}
.mstep{border-radius:16px;padding:14px;background:var(--panel);box-shadow:0 1px 0 var(--line),0 10px 20px rgba(14,27,61,.06);min-height:120px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mstep h4{font-size:1rem}
.mstep.proc{background:var(--term);color:var(--term-ink)}
.mstep.proc h4{color:var(--amber)}
.marrow{font-size:1.6rem;color:var(--ink-3)}
.field{font:inherit;width:100%;border:2px solid var(--line-2);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:700}
.screen{border-radius:12px;padding:10px;background:#E9FFF6;color:var(--emerald-d);font-weight:800;min-height:48px}
@media(max-width:760px){.machine{grid-template-columns:1fr}.marrow{transform:rotate(-90deg);justify-self:center}}

/* tester table */
.ttable{width:100%;border-collapse:collapse;font-size:.95rem}
.ttable th,.ttable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.ttable th{font-family:var(--f-display);font-size:.85rem;color:var(--ink-2)}
.ttable td.ok{color:var(--emerald-d);font-weight:800}
.ttable td.bad{color:var(--rose);font-weight:800}
.tablewrap{overflow-x:auto}

/* ===== final mission / city ===== */
.chap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chap i{font-style:normal;flex:1;min-width:34px;height:8px;border-radius:999px;background:var(--line)}
.chap i.done{background:var(--emerald)}
.chap i.cur{background:var(--amber)}
.city .cell{background:#F1F4FA}
.city .cell.road{background:#DCE3F2}
.ending{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at 50% 30%,#1D3B9E,#0B1640 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
.ending .line{font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,4.4vw,2rem);opacity:0;transform:translateY(12px);transition:opacity .9s var(--ease),transform .9s var(--ease);max-width:30ch}
.ending .line.show{opacity:1;transform:none}
.ending .big{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;color:var(--amber)}

/* ===== teacher ===== */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:700px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:.92rem}
.hbar .t{height:14px;border-radius:999px;background:var(--royal-t);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:999px;background:var(--royal);transition:width .5s var(--ease)}
.hbar .vlab{font-weight:800;text-align:end}
.hbar[data-tip]{cursor:default}
@media(max-width:520px){.hbar{grid-template-columns:96px 1fr 42px}}
.stable{width:100%;border-collapse:collapse;min-width:620px;font-size:.93rem}
.stable th,.stable td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.stable th{font-family:var(--f-display);font-size:.82rem;color:var(--ink-2)}
.stable td{white-space:nowrap}
.stable tr.sel td{background:var(--royal-t)}
.stable tbody tr{cursor:pointer}
.mini{height:8px;border-radius:999px;background:var(--line);overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-inline-start:6px}
.mini i{display:block;height:100%;background:var(--emerald)}
.pill2{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:800;margin:2px}
.pill2.m{background:var(--emerald-t);color:var(--emerald-d)}
.pill2.s{background:var(--amber-t);color:var(--amber-d)}
.demo-note{background:var(--amber-t);color:#7A4A00;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.tip{position:fixed;z-index:80;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700;pointer-events:none;transform:translate(-50%,-120%)}
</style>
<div id="app" dir="rtl" lang="ar"></div>
