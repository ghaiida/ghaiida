<title>مغامرات بتّو البرمجية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Mono:wght@500&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: graph-paper school notebook; one centered column of game screens swapped by a tiny router. Single committed light look. */
:root{
  --paper:#F6F8FC; --grid:#E2E8F3; --line:#C4CEE2; --ink:#1B2440; --ink-soft:#56607B; --card:#FFFFFF;
  --blue:#2D5BEF; --blue-tint:#E6EDFF; --orange:#EE6F2D; --orange-tint:#FFEBDD;
  --yellow:#FFD23F; --yellow-tint:#FFF6D6; --green:#159957; --green-tint:#E1F5EA; --red:#DC3B4F; --red-tint:#FDE6E9;
  --code-bg:#17203B; --code-fg:#E8EDF9; --code-dim:#8C9BC0;
  --f-display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{direction:rtl}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed}
#app{max-width:880px;margin-inline:auto;padding-inline:16px;padding-block:10px 72px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0 0 .6em}
mark{background:linear-gradient(transparent 52%,var(--yellow) 52%);color:inherit;padding-inline:2px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;border:2px solid var(--ink);border-radius:14px;padding:.6em 1.15em;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);color:#fff}
.btn.hot{background:var(--orange);color:#fff}
.btn.stop{background:var(--red);color:#fff}
.btn.sel{background:var(--yellow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.bar{display:flex;align-items:center;gap:10px;padding-block:6px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--paper) 78%,transparent)}
.bar h2{flex:1;min-width:0;font-size:clamp(1.05rem,3.6vw,1.35rem)}
.bar h2::after{content:"";display:block;height:5px;width:64px;border-radius:9px;background:var(--tone);margin-top:4px}
.t-blue{--tone:var(--blue)}
.t-orange{--tone:var(--orange)}
.topline{display:flex;justify-content:flex-end;padding-top:6px}
/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-block:10px 26px}
.hero h1{font-size:clamp(2.4rem,8vw,4rem);font-weight:800}
.hero h1 .hl{color:var(--blue)}
.eyebrow{font-weight:700;color:var(--orange);font-size:.9rem;letter-spacing:.02em;margin-bottom:2px}
.lead{font-size:1.08rem;max-width:56ch}
.hero-bot svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero-bot{justify-self:center}.lead{margin-inline:auto}}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.worlds{grid-template-columns:1fr}}
.world{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:3px solid var(--ink);border-radius:24px;padding:20px;cursor:pointer;background:var(--card);box-shadow:0 7px 0 var(--ink);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.world>*{position:relative;z-index:1}
.world:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--ink)}
.world:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.w-blue{--tone:var(--blue);--tone-ink:#1E44C4;--tint:var(--blue-tint)}
.w-orange{--tone:var(--orange);--tone-ink:#B4461A;--tint:var(--orange-tint)}
.w-tag{font-weight:700;font-size:.85rem;color:#fff;background:var(--tone);border-radius:999px;padding:2px 12px}
.w-title{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.2}
.w-sub{font-weight:700;color:var(--tone-ink)}
.w-list{color:var(--ink-soft);font-size:.92rem}
.world .w-art{position:absolute;z-index:0;inset-inline-end:10px;bottom:-30px;font-family:var(--f-display);font-size:7.5rem;font-weight:800;color:var(--tint);line-height:1;pointer-events:none;direction:ltr}
.w-prog{width:100%;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:8px;background:var(--paper)}
.w-prog i{display:block;height:100%;background:var(--tone)}
.w-cta{font-family:var(--f-display);font-weight:800;color:var(--tone-ink);margin-top:4px}
.homecert{margin-top:22px;display:flex;justify-content:center}
/* maps */
.track{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.track::before{content:"";position:absolute;inset-inline-start:27px;top:24px;bottom:24px;border-inline-start:3px dashed var(--line)}
.station{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:start;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);position:relative}
.station:hover{background:var(--tint)}
.num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:var(--paper);border:3px solid var(--tone);color:var(--ink)}
.station.done .num{background:var(--tone);color:#fff}
.st-body{display:flex;flex-direction:column;min-width:0}
.st-body b{font-family:var(--f-display);font-size:1.2rem;line-height:1.35}
.st-body span{color:var(--ink-soft);font-size:.93rem}
.st-body small{color:var(--ink-soft);font-size:.82rem;margin-top:2px}
.st-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.gtag{font-size:.78rem;font-weight:700;background:var(--tint);color:var(--tone-ink);border-radius:999px;padding:1px 10px;white-space:nowrap}
.stars{color:#E3A000;letter-spacing:2px;font-size:1rem}
.stars .dim{color:var(--line)}
@media(max-width:520px){.station{grid-template-columns:46px 1fr}.num{width:46px;height:46px;font-size:1.3rem}.st-side{grid-column:2;flex-direction:row;align-items:center;gap:8px}.track::before{inset-inline-start:22px}}
.sect{font-size:1.3rem;margin:10px 0 10px}
.chant{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.chant span{background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:2px 12px}
.chant i{font-style:normal;color:var(--ink-soft)}
.boss{width:100%;text-align:start;display:flex;flex-direction:column;gap:2px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px 18px;cursor:pointer;box-shadow:0 6px 0 var(--orange);margin-bottom:18px}
.boss b{font-family:var(--f-display);font-size:1.5rem}
.boss-k{color:var(--yellow);font-weight:700;font-size:.85rem}
.tablewrap{overflow-x:auto}
.dict{width:100%;border-collapse:collapse;min-width:520px;font-size:.93rem}
.dict th,.dict td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.dict th{font-family:var(--f-display);font-size:1rem}
.dict code{font-family:var(--f-mono);direction:ltr;display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.85rem}
/* shared pieces */
.talk{display:flex;gap:12px;align-items:flex-end;margin-block:4px 18px}
.talk-bot{flex:none}
.bubble{flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 4px 18px;padding:12px 16px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;margin-block:0 18px;box-shadow:0 6px 0 rgba(27,36,64,.12)}
.panel h3{font-size:1.25rem;margin-bottom:6px}
.pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-size:.82rem;margin-inline-end:6px;font-weight:700}
.task{font-size:1.1rem}
.hint{color:var(--ink-soft);font-size:.92rem;margin:4px 0 12px}
.lbl{font-weight:700;font-size:.85rem;color:var(--ink-soft);margin-bottom:6px}
.empty{color:var(--ink-soft);font-size:.9rem}
.q{font-weight:700;font-size:1.08rem;margin-top:10px}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:500;border:2px solid}
.fb.ok{background:var(--green-tint);color:#0D5F35;border-color:var(--green)}
.fb.bad{background:var(--red-tint);color:#8E1A2B;border-color:var(--red)}
.chip{font:inherit;font-weight:500;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:start}
.chip.sel,.chip.on{background:var(--yellow)}
.chip.ok{background:var(--green-tint);border-color:var(--green)}
.chip.bad{background:var(--red-tint);border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-bottom:14px}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.bins{grid-template-columns:1fr}}
.bin{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:110px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column}
.bin small{color:var(--ink-soft);font-size:.82rem}
.bin.ready{border-color:var(--blue);background:var(--blue-tint)}
.bin-items{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bin-items .chip{cursor:default;box-shadow:none;font-size:.82rem;padding:2px 8px;background:var(--green-tint);border-color:var(--green)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:start;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);min-width:0}
.opt:hover:not(:disabled){background:var(--blue-tint)}
.opt.ok{background:var(--green-tint);border-color:var(--green)}
.opt.bad{background:var(--red-tint);border-color:var(--red)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.part{font-weight:700;font-size:.88rem;padding:4px 12px;border-radius:999px;border:2px solid var(--line);color:var(--ink-soft);background:var(--card)}
.part.on{border-color:var(--ink);background:var(--yellow);color:var(--ink)}
.part.ok{border-color:var(--green);color:var(--green)}
/* builder */
.b-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.b-cols{grid-template-columns:1fr}}
.b-pool{flex-direction:column;align-items:stretch}
.seq{list-style:none;margin:0;padding:10px;border:2px dashed var(--line);border-radius:14px;min-height:120px;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li{display:flex;align-items:center;gap:8px}
.seq li:not(.empty)::before{counter-increment:s;content:counter(s,arabic-indic);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.seq .chip{flex:1}
/* kitchen, literal bot, definition */
.kitchen{display:flex;justify-content:center;gap:28px;margin-top:14px;padding:12px;border-radius:16px;background:var(--orange-tint);flex-wrap:wrap}
.obj{display:flex;flex-direction:column;align-items:center;min-width:110px;text-align:center}
.obj .em{font-size:2.6rem;line-height:1.2;transition:filter .3s,opacity .3s}
.obj .em.off{filter:grayscale(1);opacity:.4}
.obj small{font-weight:500;font-size:.85rem}
.lit-stage{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:16px;background:var(--blue-tint)}
.lit-say{font-weight:500;flex:1;min-width:0}
.lit-say.oops{color:var(--red)}
.lit-say.good{color:var(--green)}
.defn{margin-top:18px;border-top:2px dashed var(--line);padding-top:16px}
.defn-title{font-family:var(--f-display);font-weight:800;font-size:1.9rem;color:var(--blue);line-height:1.2}
.defn-text{font-size:1.15rem}
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:12px}
@media(max-width:600px){.props{grid-template-columns:1fr}}
.props div{border:2px solid var(--ink);border-radius:14px;padding:10px;background:var(--paper);display:flex;flex-direction:column}
.props b{font-family:var(--f-display);font-size:1.15rem}
.props span{font-size:.9rem;color:var(--ink-soft)}
.fact{background:var(--yellow-tint);border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
/* shapes + flowchart */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.shape{background:var(--card);border:2px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);height:70px;display:grid;place-items:center}
.shape svg{height:50px;width:auto}
.shape svg *{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.shape.sel{background:var(--yellow)}
.shape.ok svg *{fill:var(--sfill)}
.shape.ok,.mean.ok{border-color:var(--green);cursor:default}
.mean{height:70px;display:flex;align-items:center}
.flowwrap{display:flex;justify-content:center;margin-top:14px}
.flow{width:min(300px,100%);height:auto}
.flow text{font-family:var(--f-body);font-size:14px;fill:var(--ink)}
.flow rect,.flow polygon{stroke:var(--ink);stroke-width:2}
.fn-oval rect{fill:#DCE6FF}
.fn-para polygon{fill:#FFF0BF}
.fn-rect rect{fill:#FFE0CC}
.fa{stroke:var(--ink);stroke-width:2;fill:none}
/* grid world */
.lvl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:720px){.lvl{grid-template-columns:1fr}}
.trans{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.trans{grid-template-columns:1fr}}
.grid{direction:ltr;display:grid;grid-template-columns:repeat(var(--w),1fr);grid-template-rows:repeat(var(--h),1fr);aspect-ratio:var(--w)/var(--h);position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card);max-width:440px;width:100%;margin-inline:auto}
.cell{border:1px solid var(--grid);display:grid;place-items:center;font-size:clamp(1.1rem,5vw,1.8rem)}
.cell.wall{background:#E8ECF5}
.cell.goal{background:var(--yellow-tint)}
.gbot{position:absolute;inset:0 auto auto 0;width:calc(100% / var(--w));height:calc(100% / var(--h));transform:translate(calc(var(--x,0) * 100%),calc(var(--y,0) * 100%));transition:transform .35s ease;display:grid;place-items:center;pointer-events:none}
.gbot.nomove{transition:none}
.gbot svg{width:66%;height:auto}
.gbot.bump svg{animation:shake .35s}
.carry{position:absolute;bottom:4%;right:6%;font-size:clamp(.7rem,2.6vw,1rem)}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.blk{font-family:var(--f-display);font-weight:700;font-size:1rem;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .15s}
.blk.on{background:var(--yellow);color:var(--ink);transform:scale(1.08)}
.blk.bad{background:var(--red)}
.blk.edited{outline:3px dashed var(--orange);outline-offset:1px}
.w-orange .blk,.loopblk .blk{background:var(--orange)}
.w-orange .blk.on,.loopblk .blk.on{background:var(--yellow)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:14px;align-content:flex-start}
.pseudo,.code,.log{border-radius:12px;padding:10px 12px;background:var(--code-bg);color:var(--code-fg);font-size:.92rem;line-height:1.85;overflow-x:auto}
.pseudo{min-height:48px}
.code{direction:ltr;text-align:left;font-family:var(--f-mono);white-space:pre;margin-block:8px}
.code.mini{font-size:.8rem;margin:0}
.cm{color:var(--code-dim)}
.ln{padding-inline-start:calc(var(--ind,0) * 1.7em + 6px);border-radius:6px;transition:background .2s,opacity .2s}
.ln.on{background:rgba(255,210,63,.3)}
.ln.skip{opacity:.35}
.kw{color:var(--yellow);font-weight:700}
.log{font-size:.86rem;min-height:120px;max-height:230px;overflow:auto}
.log div{padding-block:2px;border-bottom:1px solid rgba(255,255,255,.08)}
.log .y{color:#9BE3B8}
.log .n{color:#FF9EAB}
/* loops */
.stairs{direction:ltr;position:relative;height:260px;max-width:560px;margin-inline:auto;border-bottom:4px solid var(--ink);margin-bottom:14px}
.st{position:absolute;bottom:0;left:calc(var(--i) * 100% / var(--n));width:calc(100% / var(--n));height:calc(var(--i) * var(--sh));background:var(--orange-tint);border:2px solid var(--ink);border-bottom:0}
.flag{position:absolute;left:calc(var(--i) * 100% / var(--n));width:calc(100% / var(--n));bottom:calc(var(--i) * var(--sh) + 52px);text-align:center;font-size:1.5rem}
.sbot{position:absolute;left:calc(var(--c,0) * 100% / var(--n));bottom:calc(var(--hh,0) * var(--sh));width:calc(100% / var(--n));display:flex;justify-content:center;transition:left .3s ease,bottom .3s ease;z-index:2}
.sbot svg{width:min(44px,100%);height:auto}
.loopviz{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:12px}
.counter{display:flex;flex-direction:column;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:6px 16px;background:var(--yellow-tint);line-height:1.2}
.counter b{font-family:var(--f-display);font-size:2.2rem}
.counter small{font-size:.78rem;color:var(--ink-soft)}
.stepper{display:inline-flex;align-items:center;gap:8px;margin-inline:6px;vertical-align:middle}
.stepper b{min-width:1.4em;text-align:center;font-family:var(--f-display);font-size:1.3rem}
.sbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font-weight:800;font-size:1.1rem;cursor:pointer;line-height:1}
.loopblk{margin-top:12px;border:3px solid var(--ink);border-radius:16px;background:var(--orange);color:#fff;padding:8px 10px 12px}
.lhead{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;flex-wrap:wrap}
.lbody{margin-inline-start:20px;margin-top:8px;background:var(--card);border:2px dashed var(--ink);border-radius:12px;min-height:52px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;color:var(--ink);align-items:center}
.slot{border:2px dashed var(--line);border-radius:10px;padding:4px 10px;font-size:.85rem;color:var(--ink-soft)}
.iter{font-weight:700;min-height:1.6em;margin-top:8px;color:var(--orange)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:680px){.lab{grid-template-columns:1fr}}
.radio{display:flex;flex-direction:column;gap:8px}
.ropt{font:inherit;text-align:start;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);position:relative}
.ropt .kw{color:var(--orange)}
.ropt.sel{background:var(--yellow-tint);border-color:var(--orange);box-shadow:0 3px 0 var(--orange)}
.ropt[data-r]::after{position:absolute;inset-inline-end:10px;top:8px;font-weight:800}
.ropt[data-r="ok"]::after{content:"✓";color:var(--green)}
.ropt[data-r="bad"]::after{content:"✗";color:var(--red)}

<div id="app" dir="rtl" lang="ar"></div>
<script>
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = $('#app');
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

let S = { done: {}, stars: {}, sound: true, name: '' };
try { const o = JSON.parse(localStorage.getItem('bitto-v1') || 'null'); if (o) S = Object.assign(S, o); } catch (e) {}
function save() { try { localStorage.setItem('bitto-v1', JSON.stringify(S)); } catch (e) {} }

/* timers are cleared on every screen change, so pending animations simply stop */
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const wait = ms => new Promise(r => later(r, ms));

/* sound */
let AC = null;
function tone(f, d = .12, type = 'sine', v = .08) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  ok() { tone(660); setTimeout(() => tone(880), 90); },
  bad() { tone(190, .22, 'square', .045); },
  step() { tone(460, .05, 'triangle', .05); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .16), i * 110)); }
};

/* the robot */
function bot(mood = 'happy', size = 80) {
  const ink = '#1B2440';
  const mouth = mood === 'sad' ? `<path d="M41 62 Q50 55 59 62" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
    : mood === 'wow' ? `<ellipse cx="50" cy="60" rx="5" ry="6" fill="${ink}"/>`
    : `<path d="M40 57 Q50 66 60 57" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const eyes = mood === 'sad' ? `<path d="M35 46 h10 M55 46 h10" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
    : `<circle cx="40" cy="46" r="5" fill="${ink}"/><circle cx="60" cy="46" r="5" fill="${ink}"/><circle cx="41.5" cy="44.5" r="1.6" fill="#fff"/><circle cx="61.5" cy="44.5" r="1.6" fill="#fff"/>`;
  return `<svg class="bot" viewBox="0 0 100 118" width="${size}" height="${Math.round(size * 1.18)}" aria-hidden="true">
<line x1="50" y1="8" x2="50" y2="22" stroke="${ink}" stroke-width="3"/><circle cx="50" cy="8" r="6" fill="#EE6F2D" stroke="${ink}" stroke-width="2"/>
<rect x="8" y="38" width="8" height="18" rx="4" fill="#FFD23F" stroke="${ink}" stroke-width="2"/><rect x="84" y="38" width="8" height="18" rx="4" fill="#FFD23F" stroke="${ink}" stroke-width="2"/>
<rect x="15" y="22" width="70" height="56" rx="18" fill="#2D5BEF" stroke="${ink}" stroke-width="3"/>
<rect x="24" y="31" width="52" height="38" rx="12" fill="#fff" stroke="${ink}" stroke-width="2"/>
${eyes}${mouth}
<rect x="30" y="82" width="40" height="30" rx="9" fill="#FFD23F" stroke="${ink}" stroke-width="3"/>
<path d="M42 92 h16 M42 100 h10" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
}
function swapBot(host, mood, size) { const s = host.querySelector('svg.bot'); if (!s) return; s.insertAdjacentHTML('afterend', bot(mood, size)); s.remove(); }

/* router */
const ROUTES = {};
function go(r) {
  timers.forEach(clearTimeout); timers = [];
  if (!ROUTES[r]) r = 'home';
  ROUTES[r]();
  window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + r); } catch (e) {}
}
const soundBtn = () => `<button class="iconbtn" data-sound aria-label="تشغيل أو كتم الصوت">${S.sound ? '🔊' : '🔇'}</button>`;
function frame(title, back, body, tone = 'blue') {
  app.innerHTML = `<header class="bar t-${tone}"><button class="iconbtn" data-go="${back}" aria-label="رجوع">→</button><h2>${title}</h2>${soundBtn()}</header><main class="${tone === 'orange' ? 'w-orange' : 'w-blue'}">${body}</main>`;
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-sound]');
  if (s) { S.sound = !S.sound; save(); s.textContent = S.sound ? '🔊' : '🔇'; return; }
  const g = e.target.closest('[data-go]');
  if (g) { sfx.step(); go(g.dataset.go); }
});

/* shared ui */
const talk = (html, mood = 'happy', id = '') => `<div class="talk"${id ? ` id="${id}"` : ''}><div class="talk-bot">${bot(mood, 64)}</div><div class="bubble">${html}</div></div>`;
function setTalk(el, html, mood = 'happy') { el.querySelector('.talk-bot').innerHTML = bot(mood, 64); el.querySelector('.bubble').innerHTML = html; }
function fb(el, html, ok) { el.className = 'fb ' + (ok ? 'ok' : 'bad'); el.innerHTML = html; el.hidden = false; }
const starHTML = n => n ? `<span class="stars" aria-label="${ar(n)} نجوم">${'★'.repeat(n)}<span class="dim">${'★'.repeat(3 - n)}</span></span>` : '';
const code = s => `<div class="code">${s}</div>`;
function pseudo(lines, id = '') {
  return `<div class="pseudo"${id ? ` id="${id}"` : ''}>${lines.map(l => { const ind = (l.match(/^ */)[0].length / 4) | 0; return `<div class="ln" style="--ind:${ind}">${l.trim()}</div>`; }).join('')}</div>`;
}
function shakeEl(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function confetti() {
  if (REDUCE) return;
  const c = document.createElement('div'); c.className = 'confetti';
  const cols = ['#2D5BEF', '#EE6F2D', '#FFD23F', '#159957', '#DC3B4F'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % 5];
    s.style.animationDelay = Math.random() * .4 + 's'; s.style.animationDuration = 1.2 + Math.random() * .8 + 's';
    c.appendChild(s);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 2800);
}
function finish({ id, stars = 3, memo, next, nextLabel, map, extra = '' }) {
  S.done[id] = true; S.stars[id] = Math.max(S.stars[id] || 0, stars); save();
  sfx.win(); confetti();
  const A = $('#after');
  A.innerHTML = `<section class="panel win"><div class="win-head">${bot('happy', 56)}<div><h3>أحسنت! أتممت المهمة</h3>${starHTML(stars)}</div></div>
    <div class="memo"><span class="memo-tag">ثبّتها في ذاكرتك</span>${memo}</div>
    <div class="row">${next ? `<button class="btn ${map === 'w2' ? 'hot' : 'primary'}" data-go="${next}">${nextLabel || 'المهمة التالية'} ←</button>` : ''}${extra}<button class="btn" data-go="${map}">العودة للخريطة</button></div></section>`;
  later(() => A.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' }), 200);
}

/* tap-to-order builder */
function builder(host, items, onChange) {
  let pool = shuffle(items), seq = [];
  host.innerHTML = `<div class="b-cols"><div><div class="lbl">البطاقات</div><div class="chips b-pool"></div></div><div><div class="lbl">ترتيبك</div><ol class="seq"></ol></div></div>`;
  const P = host.querySelector('.b-pool'), Q = host.querySelector('.seq');
  const api = {
    locked: false,
    get seq() { return seq; },
    mark(i, cls) { const c = Q.children[i] && Q.children[i].querySelector('.chip'); if (c) c.classList.add(cls); },
    clearMarks() { Q.querySelectorAll('.chip').forEach(c => c.classList.remove('on', 'ok', 'bad')); }
  };
  function draw() {
    P.innerHTML = pool.map(it => `<button class="chip" data-id="${it.id}">${it.t}</button>`).join('') || '<span class="empty">انتهت البطاقات ✓</span>';
    Q.innerHTML = seq.map(it => `<li><button class="chip" data-id="${it.id}">${it.t}</button></li>`).join('') || '<li class="empty">اضغط البطاقات بالترتيب الذي تراه صحيحًا</li>';
    onChange && onChange(seq);
  }
  P.onclick = e => { const b = e.target.closest('[data-id]'); if (!b || api.locked) return; const i = pool.findIndex(x => String(x.id) === b.dataset.id); seq.push(pool.splice(i, 1)[0]); sfx.step(); draw(); };
  Q.onclick = e => { const b = e.target.closest('[data-id]'); if (!b || api.locked) return; const i = seq.findIndex(x => String(x.id) === b.dataset.id); pool.push(seq.splice(i, 1)[0]); draw(); };
  draw();
  return api;
}

/* multiple-choice quiz */
function quiz(host, qs, onDone) {
  let i = 0, wrong = 0;
  function show() {
    const q = qs[i], opts = q.fixed ? q.opts : shuffle(q.opts);
    host.innerHTML = `<span class="pill">سؤال ${ar(i + 1)} من ${ar(qs.length)}</span>${q.pre || ''}<p class="q">${q.q}</p>
      <div class="opts${q.fixed ? ' answers' : ''}">${opts.map((o, j) => `<button class="opt" data-j="${j}">${o.t}</button>`).join('')}</div>
      <div class="fb" hidden></div><div class="row" hidden><button class="btn primary">${i < qs.length - 1 ? 'السؤال التالي ←' : 'إنهاء ←'}</button></div>`;
    const F = host.querySelector('.fb'), N = host.querySelector('.row');
    let answered = false;
    host.querySelector('.opts').onclick = e => {
      const b = e.target.closest('.opt'); if (!b || answered || b.disabled) return;
      const o = opts[+b.dataset.j];
      if (o.ok) {
        answered = true; b.classList.add('ok'); sfx.ok(); fb(F, '✓ ' + (o.r || 'صحيح!'), true); N.hidden = false;
        host.querySelectorAll('.opt').forEach(x => { if (x !== b) x.disabled = true; });
      } else { wrong++; b.classList.add('bad'); b.disabled = true; sfx.bad(); fb(F, '✗ ' + (o.r || 'حاول مرة أخرى'), false); }
    };
    N.querySelector('button').onclick = () => { i++; if (i < qs.length) show(); else onDone(wrong); };
  }
  show();
}

/* grid world: robot moves on a board */
const DIR = {
  U: [0, -1, '↑', 'أعلى', 'robot.move_up()', 'الأعلى'],
  D: [0, 1, '↓', 'أسفل', 'robot.move_down()', 'الأسفل'],
  R: [1, 0, '→', 'يمين', 'robot.move_right()', 'اليمين'],
  L: [-1, 0, '←', 'يسار', 'robot.move_left()', 'اليسار']
};
const blkLabel = k => `${DIR[k][2]} ${DIR[k][3]}`;
function makeGrid(host, L) {
  const walls = new Set(L.walls.map(([x, y]) => x + ',' + y));
  let cells = '';
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const w = walls.has(x + ',' + y), g = x === L.goal[0] && y === L.goal[1];
    cells += `<div class="cell${w ? ' wall' : ''}${g ? ' goal' : ''}">${w ? '🪑' : g ? '🙋' : ''}</div>`;
  }
  host.innerHTML = `<div class="grid" style="--w:${L.w};--h:${L.h}" role="img" aria-label="لوحة المتاهة">${cells}<div class="gbot">${bot('happy', 40)}<span class="carry">🧃</span></div></div>`;
  const B = host.querySelector('.gbot'); let pos;
  const place = (x, y) => { pos = [x, y]; B.style.setProperty('--x', x); B.style.setProperty('--y', y); };
  const mood = m => swapBot(B, m, 40);
  function reset() { B.classList.add('nomove'); place(L.start[0], L.start[1]); void B.offsetWidth; B.classList.remove('nomove'); mood('happy'); }
  function bump() { mood('sad'); B.classList.remove('bump'); void B.offsetWidth; B.classList.add('bump'); sfx.bad(); }
  async function run(cmds, onStep) {
    reset(); await wait(300);
    for (let i = 0; i < cmds.length; i++) {
      onStep && onStep(i);
      const [dx, dy] = DIR[cmds[i]], nx = pos[0] + dx, ny = pos[1] + dy;
      if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h) { bump(); return { ok: false, i, why: 'edge' }; }
      if (walls.has(nx + ',' + ny)) { bump(); return { ok: false, i, why: 'wall' }; }
      place(nx, ny); sfx.step(); await wait(420);
    }
    const ok = pos[0] === L.goal[0] && pos[1] === L.goal[1];
    mood(ok ? 'happy' : 'sad');
    return { ok, i: cmds.length - 1, why: ok ? '' : 'short' };
  }
  reset();
  return { run, reset };
}
const gridFail = r => r.why === 'short' ? 'انتهت الأوامر ولم يصل بتّو إلى الطالب بعد.'
  : `💥 عند الأمر رقم ${ar(r.i + 1)} ${r.why === 'wall' ? 'اصطدم بتّو بكرسي' : 'خرج بتّو من حدود الفصل'}!`;

    { t: 'درجة العلوم', b: 'in', r: 'صحيح! هي إحدى الدرجات الثلاث.' },

    { t: 'عدد المواد (٣)', b: 'in', r: 'ممتاز! سنقسم المجموع على هذا العدد.' },
    { t: 'المعدّل', b: 'out', r: 'بالضبط! هذا ما يريد المستخدم أن يراه في النهاية.' },
    { t: 'لون حقيبة الطالب', b: 'no', r: 'صحيح، لون الحقيبة لا يغيّر المعدل أبدًا 😄' },
    { t: 'اسم المدرسة', b: 'no', r: 'صحيح، لا نحتاجه في الحساب.' },
    { t: 'حالة الطقس اليوم', b: 'no', r: 'صحيح، الطقس لا علاقة له بالمعدل.' }
  ]).map((x, i) => ({ ...x, i }));
  const HINT = { in: 'هل نحتاج هذه المعلومة لنبدأ الحساب؟', out: 'هل هذا شيء نعطيه للبرنامج، أم شيء ننتظره منه؟', no: 'فكّر: هل تغيّر هذه المعلومة المعدل؟' };
  let sel = null, placed = 0, wrong = 0;
  const C = $('#chips'), F = $('#fb');
  C.innerHTML = ITEMS.map(x => `<button class="chip" data-i="${x.i}">${x.t}</button>`).join('');
  C.onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    C.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));

        sfx.ok(); chip.remove();
        bin.querySelector('.bin-items').insertAdjacentHTML('beforeend', `<span class="chip">${it.t}</span>`);
        fb(F, '✓ ' + it.r, true); placed++; sel = null; $$('.bin').forEach(x => x.classList.remove('ready'));

          id: 'w1s1', map: 'w1', next: 'w1s2', stars: wrong === 0 ? 3 : wrong <= 2 ? 2 : 1,

        });
      } else { sfx.bad(); wrong++; shakeEl(bin); fb(F, '✗ ليس هنا. ' + HINT[it.b], false); }
    };
    bin.onclick = act;
    bin.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });
};

];
function avgFlow() {
  const N = [['oval', 'ابدأ'], ['para', 'أدخل الدرجات الثلاث'], ['rect', 'المجموع = د١ + د٢ + د٣'], ['rect', 'المعدل = المجموع ÷ ٣'], ['para', 'اطبع المعدل'], ['oval', 'النهاية']];
  let s = '';
  N.forEach(([k, t], i) => {
    const y = 8 + i * 64, x = 30, w = 200, h = 42;
    const shape = k === 'oval' ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="21"/>`
      : k === 'para' ? `<polygon points="${x + 18},${y} ${x + w},${y} ${x + w - 18},${y + h} ${x},${y + h}"/>`
      : `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    s += `<g class="fn-${k}">${shape}<text x="130" y="${y + h / 2 + 1}" dominant-baseline="middle" text-anchor="middle">${t}</text></g>`;
    if (i < N.length - 1) s += `<path class="fa" d="M130 ${y + h} V ${y + 62} M124 ${y + 56} L130 ${y + 63} L136 ${y + 56}"/>`;
  });
  return `<svg class="flow" viewBox="0 0 260 ${8 + 6 * 64}" role="img" aria-label="مخطط انسيابي لبرنامج حساب المعدل">${s}</svg>`;
}
ROUTES.w1s2 = () => {
  frame('المحطة ٢ · تصميم الحل (الخوارزمية)', 'w1', `
  ${talk('قبل أن نكتب أي كود، نخطط للحل خطوة بخطوة. هذا التخطيط اسمه <b>الخوارزمية</b>. لكن احذر: بتّو ينفّذ كل شيء <b>حرفيًا</b>! لنختبره أولًا…', 'happy', 't')}
  <div class="parts"><span class="part" data-p="1">أ · بتّو الحرفي</span><span class="part" data-p="2">ب · مطبخ الخوارزمية</span><span class="part" data-p="3">ج · لغة الأشكال</span></div>
  <section class="panel" id="P"></section><div id="after"></div>`);
  const T = $('#t'), P = $('#P');
  const setPart = n => $$('.part').forEach(p => { const k = +p.dataset.p; p.classList.toggle('on', k === n); p.classList.toggle('ok', k < n); });
  let teaTries = 0, shapeWrong = 0;
  partA();

  function partA() {
    setPart(1); let r = 0;
    const show = () => {
      const q = LIT[r];
      P.innerHTML = `<h3>أعطِ بتّو أمرًا يفهمه</h3><p class="task"><span class="pill">المهمة ${ar(r + 1)} من ${ar(LIT.length)}</span>${q.task}</p>
        <div class="opts">${q.opts.map((o, j) => `<button class="opt" data-j="${j}">«${o.t}»</button>`).join('')}</div>
        <div class="lit-stage" id="ls">${bot('happy', 64)}<div class="lit-say">بانتظار أمرك…</div></div>
        <div class="row" id="nx" hidden><button class="btn primary">${r < LIT.length - 1 ? 'المهمة التالية ←' : 'إلى مطبخ الخوارزمية ←'}</button></div>`;
      P.querySelector('.opts').onclick = e => {
        const b = e.target.closest('.opt'); if (!b || b.disabled) return;
        const o = q.opts[+b.dataset.j];
        $('#ls').innerHTML = bot(o.ok ? 'happy' : 'wow', 64) + `<div class="lit-say ${o.ok ? 'good' : 'oops'}">${o.r}</div>`;
        if (o.ok) { sfx.ok(); b.classList.add('ok'); P.querySelectorAll('.opt').forEach(x => x.disabled = true); $('#nx').hidden = false; }
        else { sfx.bad(); b.classList.add('bad'); b.disabled = true; }
      };
      $('#nx button').onclick = () => {
        r++;
        if (r < LIT.length) show();
        else { setTalk(T, 'لاحظت؟ الأمر الغامض يُنتج نتيجة غريبة. الحاسب مثل بتّو تمامًا: <mark>لا يخمّن</mark>. الآن رتّب خطوات صنع كوب شاي، وسينفّذها بتّو بالترتيب الذي تضعه أنت بالضبط.'); partB(); }
      };
    };
    show();
  }

  function partB() {
    setPart(2);
    P.innerHTML = `<h3>مطبخ الخوارزمية: كوب شاي ☕</h3><p class="hint">اضغط البطاقات بالترتيب. اضغط بطاقة في «ترتيبك» لإرجاعها.</p>
      <div id="bd"></div>
      <div class="kitchen"><div class="obj"><span class="em off" id="kE">🫖</span><small id="kS">الغلاية فارغة</small></div><div class="obj"><span class="em off" id="cE">☕</span><small id="cS">الكوب فارغ</small></div></div>
      <div class="row"><button class="btn primary" id="runT" disabled>▶ شغّل الخوارزمية</button></div><div class="fb" id="fbT" hidden></div><div id="defn"></div>`;
    const bd = builder($('#bd'), TEA, seq => { $('#runT').disabled = seq.length !== TEA.length; });
    const K = (e, s, on) => { $('#kE').classList.toggle('off', !on); $('#kE').textContent = e; $('#kS').textContent = s; };
    const C = (s, on) => { $('#cE').classList.toggle('off', !on); $('#cS').textContent = s; };
    function step(id, st) {
      switch (id) {
        case 1: st.water = 1; K('🫖', 'فيها ماء بارد', true); return '';
        case 2: if (!st.water) return 'شغّلت الغلاية وهي فارغة! 🔥 كادت تحترق. يجب أن نملأها أولًا.';
          st.boil = 1; K('♨️', 'الماء يغلي', true); return '';
        case 3: st.bag = 1; C(st.pour ? 'ماء ساخن + كيس شاي' : 'فيه كيس شاي', true); return '';
        case 4: if (!st.water) return 'سكبت… لا شيء! الغلاية فارغة أصلًا.';
          if (!st.boil) return 'سكبت ماءً باردًا 🥶 لن يصنع شايًا!';
          st.pour = 1; C(st.bag ? 'ماء ساخن + كيس شاي' : 'فيه ماء ساخن', true); return '';
        case 5: if (!st.pour) return 'انتظرت ٣ دقائق أمام كوب فارغ… ⏳ لم يحدث شيء!';
          if (!st.bag) return 'انتظرت، لكن لا يوجد كيس شاي في الكوب! النتيجة: ماء ساخن فقط.';
          st.wait = 1; C('الشاي يتخمّر…', true); return '';
        case 6: if (!st.wait) return 'قدّمت الكوب قبل أن يجهز الشاي… طعمه غريب! 😖';
          C('شاي جاهز! 😋', true); return '';
      }
    }
    $('#runT').onclick = async () => {
      bd.locked = true; $('#runT').disabled = true; bd.clearMarks(); $('#fbT').hidden = true; teaTries++;
      K('🫖', 'الغلاية فارغة', false); C('الكوب فارغ', false);
      const st = {}, seq = bd.seq;
      for (let i = 0; i < seq.length; i++) {
        bd.mark(i, 'on'); await wait(700);
        const err = step(seq[i].id, st);
        bd.clearMarks();
        for (let j = 0; j < i; j++) bd.mark(j, 'ok');
        if (err) { bd.mark(i, 'bad'); sfx.bad(); fb($('#fbT'), `✗ عند الخطوة ${ar(i + 1)}: ${err}<br><small>الترتيب مهم! أرجِع البطاقات الخاطئة وجرّب مرة أخرى.</small>`, false); bd.locked = false; $('#runT').disabled = false; return; }
        bd.mark(i, 'ok'); sfx.step();
      }
      sfx.ok(); fb($('#fbT'), '✓ كوب شاي مثالي! بتّو نفّذ خوارزميتك خطوة بخطوة.', true);
      setTalk(T, 'رائع! الآن عرفت معنى <b>الخوارزمية</b> بنفسك. اقرأ التعريف بالأسفل، ثم انتقل لآخر جزء.', 'happy');

function codingLevel(host, L, onWin, max = 20) {
  host.innerHTML = `<div class="lvl"><div class="gh"></div><div>
    <div class="lbl">اضغط الأوامر لتضيفها إلى برنامجك</div>
    <div class="pal">${['U', 'D', 'R', 'L'].map(k => `<button class="blk" data-add="${k}">${blkLabel(k)}</button>`).join('')}</div>
    <div class="lbl" style="margin-top:12px">برنامجك <span class="cnt"></span> · اضغط أمرًا لحذفه</div>
    <div class="prog"></div>
    <div class="row"><button class="btn primary" data-a="run">▶ شغّل</button><button class="btn" data-a="clear">مسح الكل</button></div>
    <div class="fb" hidden></div></div>
    <div class="trans"><div><div class="lbl">الخوارزمية بلغتنا</div><div class="pseudo ps"></div></div><div><div class="lbl">البرنامج نفسه بلغة بايثون</div><div class="code cd"></div></div></div></div>`;
  const g = makeGrid(host.querySelector('.gh'), L);
  const P = host.querySelector('.prog'), F = host.querySelector('.fb'), PS = host.querySelector('.ps'), CD = host.querySelector('.cd'), CNT = host.querySelector('.cnt');
  let prog = [], busy = false;
  const draw = () => {
    P.innerHTML = prog.map((k, i) => `<button class="blk" data-i="${i}">${blkLabel(k)}</button>`).join('') || '<span class="empty">برنامجك فارغ…</span>';
    CNT.textContent = `(${ar(prog.length)} أمر)`;
    PS.innerHTML = prog.map((k, i) => `<div class="ln">${ar(i + 1)}. تحرّك خطوة إلى ${DIR[k][5]}</div>`).join('') || '<div class="ln skip">…</div>';
    CD.innerHTML = prog.length ? '<span class="cm"># برنامج بتّو</span>\n' + prog.map(k => DIR[k][4]).join('\n') : '<span class="cm"># ...</span>';
  };
  host.querySelector('.pal').onclick = e => {
    const b = e.target.closest('[data-add]'); if (!b || busy) return;
    if (prog.length >= max) { fb(F, `الحد الأقصى ${ar(max)} أمرًا.`, false); return; }
    prog.push(b.dataset.add); sfx.step(); F.hidden = true; draw();
  };
  P.onclick = e => { const b = e.target.closest('[data-i]'); if (!b || busy) return; prog.splice(+b.dataset.i, 1); draw(); };
  host.querySelector('[data-a=clear]').onclick = () => { if (busy) return; prog = []; draw(); g.reset(); F.hidden = true; };
  host.querySelector('[data-a=run]').onclick = async () => {
    if (busy) return;
    if (!prog.length) { fb(F, 'أضف بعض الأوامر أولًا.', false); return; }
    busy = true; F.hidden = true; draw();
    const blks = [...P.querySelectorAll('.blk')], lns = [...PS.querySelectorAll('.ln')];
    const res = await g.run(prog, i => { blks.forEach((b, j) => b.classList.toggle('on', j === i)); lns.forEach((b, j) => b.classList.toggle('on', j === i)); });
    if (res.ok) { sfx.ok(); fb(F, '🎉 وصل العصير! برنامجك يعمل.', true); onWin(prog.length); return; } // stays locked after a win
    busy = false;
    blks.forEach(b => b.classList.remove('on')); if (blks[res.i]) blks[res.i].classList.add('bad');
    fb(F, gridFail(res) + (res.why === 'short' ? ' أكمل البرنامج!' : ' احذف الأمر الخاطئ وجرّب.'), false);
  };
  draw();
}

function debugLevel(host, L, buggy, onWin, onTry) {
  let prog = [...buggy], busy = false, tries = 0, ran = false;
  const orig = [...buggy];
  host.innerHTML = `<div class="lvl"><div class="gh"></div><div>
    <div class="lbl">برنامج زميلك (اضغط أمرًا لتغيير اتجاهه 🔄)</div>
    <div class="prog"></div>
    <div class="row"><button class="btn primary" data-a="run">▶ اختبر البرنامج</button></div>
    <div class="fb" hidden></div>
    <div class="lbl" style="margin-top:12px">سجل الاختبارات 🧪</div><div class="log"><div>لم تُجرَ أي تجربة بعد.</div></div></div></div>`;
  const g = makeGrid(host.querySelector('.gh'), L);
  const P = host.querySelector('.prog'), F = host.querySelector('.fb'), LOG = host.querySelector('.log');
  const cyc = { U: 'R', R: 'D', D: 'L', L: 'U' };
  const draw = () => { P.innerHTML = prog.map((k, i) => `<button class="blk${k !== orig[i] ? ' edited' : ''}" data-i="${i}">${blkLabel(k)}</button>`).join(''); };
  P.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || busy) return;
    if (!ran) { fb(F, 'المبرمج الذكي يختبر أولًا 😉 اضغط «اختبر البرنامج» لترى أين المشكلة.', false); return; }
    const i = +b.dataset.i; prog[i] = cyc[prog[i]]; sfx.step(); draw();
  };
  host.querySelector('[data-a=run]').onclick = async () => {
    if (busy) return; busy = true; ran = true; tries++; onTry(); F.hidden = true; draw();
    const blks = [...P.querySelectorAll('.blk')];
    const res = await g.run(prog, i => blks.forEach((b, j) => b.classList.toggle('on', j === i)));
    if (tries === 1) LOG.innerHTML = '';
    LOG.insertAdjacentHTML('beforeend', `<div class="${res.ok ? 'y' : 'n'}">التجربة ${ar(tries)}: ${res.ok ? '✓ وصل بتّو! لا توجد أخطاء.' : '✗ ' + gridFail(res)}</div>`);
    if (res.ok) { sfx.ok(); fb(F, '🐛 تم اصطياد كل الحشرات! البرنامج يعمل.', true); onWin(); return; }
    busy = false; blks.forEach(b => b.classList.remove('on')); if (blks[res.i]) blks[res.i].classList.add('bad');
    fb(F, res.why === 'short' ? 'وصلنا لنهاية البرنامج ولم يصل بتّو. ابحث عن الأمر الخاطئ.' : `الحشرة غالبًا في الأمر رقم ${ar(res.i + 1)} أو قبله. اضغطه لتغيير اتجاهه، ثم اختبر مرة أخرى.`, false);
  };
  draw();
}

/* ---------- loop 1: stairs ---------- */
function makeStairs(host, N) {
  const sh = Math.min(28, Math.floor(170 / N));
  host.innerHTML = `<div class="stairs" style="--n:${N + 2};--sh:${sh}px" role="img" aria-label="سلّم من ${ar(N)} درجات">${Array.from({ length: N }, (_, i) => `<div class="st" style="--i:${i + 1}"></div>`).join('')}<div class="flag" style="--i:${N}">🏁</div><div class="sbot">${bot('happy', 44)}</div></div>`;
  const B = host.querySelector('.sbot'); let k = 0;
  const place = (c, h, instant) => {
    if (instant) B.style.transition = 'none';
    B.style.setProperty('--c', c); B.style.setProperty('--hh', h);
    if (instant) { void B.offsetWidth; B.style.transition = ''; }
    k = c;
  };
  const api = {
    set(c, instant) { place(c, c, instant); swapBot(B, 'happy', 44); },
    async climb(n, onStep) {
      api.set(0, true); await wait(300);
      for (let i = 0; i < n; i++) {
        onStep && onStep(i);
        if (k === N) { place(N + 1, N + 1); await wait(350); place(N + 1, 0); swapBot(B, 'sad', 44); sfx.bad(); return 'over'; }
        place(k + 1, k + 1); sfx.step(); await wait(400);
      }
      if (k === N) { swapBot(B, 'happy', 44); return 'ok'; }
      swapBot(B, 'sad', 44); return 'short';
    }
  };
  return api;
}

      else finish({ id: 'c3', map: 'w2', next: 'boss', nextLabel: 'التحدي النهائي', stars: score >= 6 ? 3 : score >= 4 ? 2 : 1,
        memo: `<p><b>وإلا إذا (<span dir="ltr">else if</span>)</b> = سلسلة شروط تُفحص <mark>من الأعلى إلى الأسفل</mark>. أول شرط صحيح يُنفَّذ، والباقي يُتجاهل. وإن لم يصح أي شرط يُنفَّذ «وإلا».</p>
          ${code('if grade >= 90:\n    print("ممتاز")\nelif grade >= 80:\n    print("جيد جدًا")\nelif grade >= 65:\n    print("جيد")\nelse:\n    print("يحتاج إلى تحسين")')}<p>⚠️ الترتيب الخاطئ يصنع <b>خطأً منطقيًا</b>: البرنامج يعمل… لكنه يعطي نتيجة خاطئة.</p>` });
    };
  }
  show();
};

/* ---------- boss: fizz (loop + if) ---------- */
ROUTES.boss = () => {
  frame('التحدي النهائي · بِز', 'w2', `
  ${talk('الآن تجمع القوّتين: <b>حلقة</b> تعدّ من ١ إلى ١٥، وداخلها <b>شرط</b>. أنت الحاسب! لكل عدد: إذا كان يقبل القسمة على ٣ اضغط <b>«بِز!»</b>، وإلا اضغط <b>«قل العدد»</b>. أسرع قبل أن ينتهي الوقت!', 'wow', 't')}
  <section class="panel" id="P"></section><div id="after"></div>`, 'orange');
  const MODES = {
    1: { ms: 3500, title: 'الجولة ١: بِز',
      lines: ['<span class="kw">كرر</span> لكل عدد من ١ إلى ١٥:', '    <span class="kw">إذا</span> العدد يقبل القسمة على ٣:', '        قل «بِز»', '    <span class="kw">وإلا</span>:', '        قل العدد'],
      btns: [['num', 'قل العدد'], ['fizz', 'بِز!']],
      ans: n => n % 3 === 0 ? 'fizz' : 'num',
      path: { fizz: [1, 2], num: [1, 3, 4] },
      why: (n, a) => a === 'fizz' ? `${ar(n)} ÷ ٣ = ${ar(n / 3)} بلا باقٍ ← «بِز»` : `${ar(n)} لا يقبل القسمة على ٣ ← «${ar(n)}»` },
    2: { ms: 5000, title: 'جولة الأبطال: بِزطَن',
      lines: ['<span class="kw">كرر</span> لكل عدد من ١ إلى ١٥:', '    <span class="kw">إذا</span> يقبل القسمة على ٣ <span class="kw">و</span> على ٥:', '        قل «بِزطَن»', '    <span class="kw">وإلا إذا</span> يقبل القسمة على ٣:', '        قل «بِز»', '    <span class="kw">وإلا إذا</span> يقبل القسمة على ٥:', '        قل «طَن»', '    <span class="kw">وإلا</span>:', '        قل العدد'],
      btns: [['num', 'العدد'], ['fizz', 'بِز'], ['buzz', 'طَن'], ['fb', 'بِزطَن']],
      ans: n => n % 15 === 0 ? 'fb' : n % 3 === 0 ? 'fizz' : n % 5 === 0 ? 'buzz' : 'num',
      path: { fb: [1, 2], fizz: [1, 3, 4], buzz: [1, 3, 5, 6], num: [1, 3, 5, 7, 8] },
      why: (n, a) => ({ fb: `${ar(n)} يقبل القسمة على ٣ و ٥ معًا ← «بِزطَن»`, fizz: `${ar(n)} يقبل القسمة على ٣ فقط ← «بِز»`, buzz: `${ar(n)} يقبل القسمة على ٥ فقط ← «طَن»`, num: `${ar(n)} لا يقبل القسمة على ٣ ولا ٥ ← «${ar(n)}»` })[a] }
  };
  const P = $('#P');
  play(1);

  function play(m) {
    const M = MODES[m]; let n = 0, score = 0, tid = null, acc = false;
    if (m === 2) setTalk($('#t'), 'جولة الأبطال! الآن ٤ أزرار. لاحظ أن شرط <b>«٣ و ٥ معًا»</b> جاء <b>أولًا</b>… تذكّر لماذا من مصنّف الدرجات!', 'wow');
    P.innerHTML = `<div class="sorthead"><span class="pill">${M.title}</span><span>النقاط: <b id="sc">٠</b> من ١٥</span></div>
      <div class="bosswrap"><div>${pseudo(M.lines, 'ps')}</div>
      <div class="machine" style="margin-top:0"><div class="dots" id="dots">${'<i></i>'.repeat(15)}</div><div class="lbl" style="margin:0">العدد في هذه الدورة</div><div class="bigno" id="no">—</div><div class="tbar"><i id="tb"></i></div>
        <div class="answers">${M.btns.map(([k, t]) => `<button class="branch ${k}" data-k="${k}" disabled>${t}</button>`).join('')}</div>
        <button class="btn hot" id="go">ابدأ ▶</button></div></div><div class="fb" id="fb" hidden></div>`;
    const TB = $('#tb'), dots = $$('#dots i'), btns = $$('.answers .branch');
    const enable = on => btns.forEach(b => b.disabled = !on);
    $('#go').onclick = () => { $('#go').hidden = true; next(); };
    btns.forEach(b => b.onclick = () => answer(b.dataset.k));
    function next() {
      n++; if (n > 15) return end();
      dots[n - 1].classList.add('cur'); $('#no').textContent = ar(n);
      const lines = $$('#ps .ln'); lines.forEach(l => l.classList.remove('on', 'skip')); lines[0].classList.add('on');
      TB.style.transition = 'none'; TB.style.width = '100%'; void TB.offsetWidth; TB.style.transition = `width ${M.ms}ms linear`; TB.style.width = '0%';
      tid = later(() => answer(null), M.ms); acc = true; enable(true);
    }
    function answer(k) {
      if (!acc) return; acc = false; clearTimeout(tid); enable(false);
      TB.style.width = getComputedStyle(TB).width; TB.style.transition = 'none';
      const a = M.ans(n), ok = k === a;
      const lines = $$('#ps .ln'); M.path[a].forEach(i => lines[i].classList.add('on'));
      dots[n - 1].classList.remove('cur'); dots[n - 1].classList.add(ok ? 'ok' : 'bad');
      if (ok) { score++; sfx.ok(); } else sfx.bad();
      $('#sc').textContent = ar(score);
      fb($('#fb'), (k === null ? '⏰ انتهى الوقت! ' : ok ? '✓ ' : '✗ ') + M.why(n, a), ok);
      later(next, ok ? 800 : 1900);
    }
    function end() {
      $('#no').textContent = '🏁';
      if (m === 1) {
        if (score >= 10) {
          finish({ id: 'boss', map: 'w2', next: 'cert', nextLabel: 'شهادتي 🏅', stars: score === 15 ? 3 : score >= 12 ? 2 : 1,
            extra: '<button class="btn hot" id="r2">جولة الأبطال ⚡</button>',
            memo: `<p><b>الحلقة تكرّر، والشرط يقرّر.</b> <mark>ومعًا يصنعان كل البرامج تقريبًا!</mark> الألعاب مثلًا تكرر رسم الشاشة ٦٠ مرة في الثانية، وفي كل مرة تسأل: إذا لمس اللاعب العدو ← انتهت اللعبة.</p>${code('for n in range(1, 16):\n    if n % 3 == 0:\n        print("بِز")\n    else:\n        print(n)')}` });
          $('#r2').onclick = () => { $('#after').innerHTML = ''; play(2); window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' }); };
        } else {
          fb($('#fb'), `حصلت على ${ar(score)} من ١٥. تحتاج ١٠ على الأقل لتهزم التحدي. ركّز: هل العدد في جدول الضرب للرقم ٣؟`, false);
          P.insertAdjacentHTML('beforeend', '<div class="row"><button class="btn hot" id="again">حاول مرة أخرى ↻</button></div>');
          $('#again').onclick = () => play(1);
        }
      } else {
        if (score >= 12) { S.done.boss2 = true; save(); sfx.win(); confetti(); }
        fb($('#fb'), score >= 12 ? `🏆 بطل حقيقي! ${ar(score)} من ١٥ في جولة الأبطال. هذه اللعبة اسمها عالميًا <span dir="ltr">FizzBuzz</span>، ويُسأل عنها المبرمجون في مقابلات العمل!` : `حصلت على ${ar(score)} من ١٥. جولة الأبطال صعبة فعلًا! حاول مرة أخرى.`, score >= 12);
        P.insertAdjacentHTML('beforeend', '<div class="row"><button class="btn hot" id="again">العب جولة الأبطال مرة أخرى ↻</button><button class="btn" data-go="cert">شهادتي 🏅</button></div>');
        $('#again').onclick = () => play(2);
      }
    }
  }
};

/* ---------- certificate ---------- */
ROUTES.cert = () => {
  const ALL = [...W1IDS, ...W2IDS], n = ALL.filter(k => S.done[k]).length;
  const BADGES = [['مهندس الخوارزميات', W1IDS], ['سيّد الحلقات', ['l1', 'l2', 'l3']], ['حارس الشروط', ['c1', 'c2', 'c3']], ['قاهر بِز', ['boss']], ['بطل بِزطَن', ['boss2']]];
  let date = ''; try { date = new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) {}
  frame('شهادتي', 'home', `
  <section class="panel"><label class="lbl" for="nm">اكتب اسمك ليظهر في الشهادة</label><input id="nm" class="inp" maxlength="40" value="${esc(S.name)}" placeholder="اسمك هنا" autocomplete="name"></section>
  <div class="cert"><div>${bot('happy', 70)}</div><p class="cert-k">شهادة مبرمج صغير</p><h1 class="cert-name" id="cn">${esc(S.name) || '…'}</h1>
    <p>أتمّ <b>${ar(n)}</b> من <b>${ar(ALL.length)}</b> مهمة في مغامرات بتّو البرمجية</p>
    <div class="badges">${BADGES.map(([t, ids]) => { const ok = ids.every(k => S.done[k]); return `<div class="badge${ok ? ' on' : ''}"><span>${ok ? '🏅' : '🔒'}</span>${t}</div>`; }).join('')}</div>
    <p class="cert-sign">توقيع: بتّو${date ? ' · ' + date : ''}</p></div>
  <div class="row"><button class="btn primary" data-go="home">الرئيسية</button><button class="btn" id="reset">ابدأ من جديد</button></div>`);
  $('#nm').oninput = e => { S.name = e.target.value; save(); $('#cn').textContent = S.name || '…'; };
  let armed = false;
  $('#reset').onclick = () => {
    if (!armed) { armed = true; $('#reset').textContent = 'متأكد؟ سيُمسح كل تقدّمك. اضغط مرة أخرى'; $('#reset').classList.add('stop'); return; }
    S.done = {}; S.stars = {}; save(); go('cert');
  };
};

go(location.hash.slice(1) || 'home');
</script>
